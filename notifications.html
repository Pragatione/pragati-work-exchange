<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<meta name="theme-color" content="#1D4ED8"/>
<title>Notifications — Pragati Work Exchange</title>
<link rel="stylesheet" href="style.css"/>
<style>
.bni .ico svg { display:block; transition:transform .2s; }
.bni.on .ico svg { stroke:var(--blue2); transform:scale(1.12); }
.bni .ico { display:flex; align-items:center; justify-content:center; font-size:22px; }
.bni .lbl { font-size:10px; font-weight:600; color:var(--s5); margin-top:1px; }
.bni.on .lbl { color:var(--blue2); }
</style>
</head>
<body>
<div id="loader">
  <div class="ld-icon"><img src="https://lh3.googleusercontent.com/d/16oZcVd80uLrux2B-jN84sTUlmOqGoPQd" alt="Pragati" onerror="this.style.display='none'"/></div>
  <div class="ld-brand">Pragati<span>.</span></div>
  <div class="ld-sub">Work Exchange · PragatiOne</div>
  <div class="ld-bar"><div class="ld-fill"></div></div>
</div>
<div id="toast"></div>

<div style="display:flex;flex-direction:column;min-height:100vh;">
  <div class="tbar"><button class="tbk" onclick="history.back()">←</button><h2>Notifications</h2><button class="btn btn-g btn-sm" onclick="markAll()">Mark all read</button></div>
  <div class="pscr pb90" style="padding:12px 16px 0;" id="notif-list"><div class="empty"><div class="spin" style="margin:0 auto;"></div></div></div>
  <nav class="bnav n4" id="notif-bnav"></nav>
</div>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
<script>

const firebase_cfg = {
  apiKey:"AIzaSyBT465A_V0oe-8wkeWk8hee7NXUBSLZcyA",
  authDomain:"pragati-work-exchange.firebaseapp.com",
  projectId:"pragati-work-exchange",
  storageBucket:"pragati-work-exchange.firebasestorage.app",
  messagingSenderId:"422215240765",
  appId:"1:422215240765:web:eefb239420262c9d822e54"
};
if(!firebase.apps.length) firebase.initializeApp(firebase_cfg);
const auth = firebase.auth();
const db   = firebase.firestore();
const FS   = firebase.firestore;
var CU=null, CD=null;
auth.onAuthStateChanged(async function(user){
  if(!user){location.href='index.html';return;}
  CU=user;
  try{var s=await db.collection('users').doc(user.uid).get(); CD=s.exists?s.data():null;}catch(e){}
  if(!CD){location.href='index.html';return;}
  
  document.getElementById('loader').classList.add('out');
  _isMain = CD && CD.role==='main';
  loadNotifs();
});

function toast(msg,type){
  var el=document.getElementById('toast'); el.textContent=msg;
  el.className=type?'on '+type:'on'; setTimeout(function(){el.className='';},3000);
}
function getP(k){return new URLSearchParams(window.location.search).get(k);}
function saveLS(k,v){try{localStorage.setItem('pg_'+k,JSON.stringify(v));}catch(e){}}
function getLS(k){try{return JSON.parse(localStorage.getItem('pg_'+k));}catch(e){return null;}}
function clearLS(k){localStorage.removeItem('pg_'+k);}
function fmtBud(w){
  var f=function(n){return n>=100000?'₹'+(n/100000).toFixed(1).replace('.0','')+'L':'₹'+n.toLocaleString('en-IN');};
  return(w.minBudget&&w.maxBudget)?f(w.minBudget)+'–'+f(w.maxBudget):w.minBudget?f(w.minBudget):'TBD';
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function initials(n){return(n||'U').split(' ').map(function(x){return x[0];}).join('').toUpperCase().slice(0,2);}
function tagClr(u){return u==='Urgent'?'t-or':u==='Critical'?'t-re':'t-gr';}
function emptyHTML(ico,t,s){return '<div class="empty"><div class="ei">'+ico+'</div><h3>'+t+'</h3><p>'+s+'</p></div>';}
function mkCard(w){
  return '<div class="wcard" onclick="goDetail('+JSON.stringify(w.id)+')">'+
    '<div class="wh"><div class="tags"><span class="tag t-bl">'+esc(w.trade||'General')+'</span>'+
    '<span class="tag '+tagClr(w.urgency)+'">'+esc(w.urgency||'Normal')+'</span></div>'+
    '<div class="wt">'+esc(w.title)+'</div>'+
    '<div class="wco">🏢 '+esc(w.company||w.postedByName||'Main Contractor')+'</div></div>'+
    '<div class="wb"><div class="wmeta"><span>📍 '+esc(w.location||'—')+'</span>'+
    '<span>⏱ '+esc(w.startDate||'TBD')+'</span>'+
    '<span>👷 '+esc(w.experience||'—')+'</span></div></div>'+
    '<div class="wf"><span class="wbud">'+fmtBud(w)+'</span>'+
    '<span class="wbids">'+(w.bids||0)+' bids</span></div></div>';
}
</script>
<script>
function loadNotifs(){
  var isMain=CD&&CD.role==='main';
  document.getElementById('notif-bnav').innerHTML = (isMain ? [
    {href:'main.html',ico:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>',lbl:'Home'},
    {href:'post.html',ico:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',lbl:'Post Work'},
    {href:'myworks.html',ico:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/><path d="M12 12v4M10 14h4"/></svg>',lbl:'My Works'},
  ] : [
    {href:'home.html',ico:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>',lbl:'Home'},
    {href:'find.html',ico:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>',lbl:'Find Work'},
    {href:'apps.html',ico:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>',lbl:'My Bids'},
  ]).map(function(it){return '<div class="bni" onclick="location.href=\''+it.href+'\'"><div class="ico">'+it.ico+'</div><div class="lbl">'+it.lbl+'</div></div>';}).join('')+
  '<div class="bni" onclick="goProfile()"><div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></div><div class="lbl">Profile</div></div>';
  var notifs=[
    {ico:'🎉',bg:'var(--green4)',title:'Work Awarded!',sub:'Congratulations! Shapoorji Pallonji awarded you the External Painting work.',time:'2 hours ago',unread:true},
    {ico:'👁️',bg:'var(--blue4)',title:'Shortlisted',sub:'Kalpataru Constructions shortlisted your bid for Interior Plastering.',time:'5 hours ago',unread:true},
    {ico:'💬',bg:'var(--blue4)',title:'New Message',sub:'Godrej Properties: "Your quotation looks good, can we discuss?"',time:'Yesterday',unread:true},
    {ico:'📋',bg:'var(--s8)',title:'New Works Near You',sub:'6 new works posted near Pune today matching your trade.',time:'Yesterday',unread:false},
    {ico:'⭐',bg:'var(--yellow4)',title:'Rating Received',sub:'Tata Realty rated you 4.8 stars for the recent Masonry work.',time:'2 days ago',unread:false},
    {ico:'🔔',bg:'var(--s8)',title:'Bid Deadline',sub:'Your application for Marble Flooring – Mumbai closes in 2 days.',time:'3 days ago',unread:false},
  ];
  document.getElementById('notif-list').innerHTML=notifs.map(function(n){
    return '<div class="notif-item '+(n.unread?'unread':'')+'" onclick="markRead(this)">'+
      '<div class="ntico" style="background:'+n.bg+';">'+n.ico+'</div>'+
      '<div style="flex:1;"><div style="font-size:13px;font-weight:600;margin-bottom:2px;">'+n.title+'</div>'+
      '<div style="font-size:12px;color:var(--s4);line-height:1.4;">'+n.sub+'</div>'+
      '<div style="font-size:10px;color:var(--s5);margin-top:4px;">'+n.time+'</div></div></div>';
  }).join('');
}
function markAll(){document.querySelectorAll('.notif-item.unread').forEach(function(el){el.classList.remove('unread');});toast('All marked as read','ok');}
function goDetail(id){location.href='detail.html?id='+id;}
var _isMain=false; function goHome(){location.href=_isMain?'main.html':'home.html';} function goMid(){location.href=_isMain?'post.html':'find.html';} function goBids2(){location.href=_isMain?'myworks.html':'apps.html';}
function goProfile(){location.href='profile.html';}
function buildBnavHTML(isMain, activeKey) {
  var pettyItems = [
    {href:'home.html', ico:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>',    lbl:'Home',      key:'home'},
    {href:'find.html', ico:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>',    lbl:'Find Work', key:'find'},
    {href:'apps.html', ico:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>',    lbl:'My Bids',   key:'apps'},
    {href:'chat.html', ico:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>',    lbl:'Messages',  key:'chat'},
  ];
  var mainItems = [
    {href:'main.html',    ico:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>',    lbl:'Home',     key:'home'},
    {href:'post.html',    ico:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',    lbl:'Post Work',key:'post'},
    {href:'myworks.html', ico:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/><path d="M12 12v4M10 14h4"/></svg>', lbl:'My Works', key:'myworks'},
    {href:'chat.html',    ico:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>',    lbl:'Messages', key:'chat'},
  ];
  var items = isMain ? mainItems : pettyItems;
  return '<nav class="bnav n4">' + items.map(function(it){
    var on = it.key === activeKey ? ' on' : '';
    return '<div class="bni'+on+'" onclick="location.href=\''+it.href+'\'">' +
      '<div class="ico">'+it.ico+'</div><div class="lbl">'+it.lbl+'</div></div>';
  }).join('') + '</nav>';
}
</script>
</body></html>
