<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<meta name="theme-color" content="#1D4ED8"/>
<title>Notifications — Pragati Work Exchange</title>
<link rel="stylesheet" href="style.css"/>
<style>
.bni{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:6px 4px;flex:1;border:none;background:none;}
.bni .ico svg{stroke:var(--s5);transition:stroke .18s;}
.bni .lbl{font-size:10px;font-weight:600;color:var(--s5);}
.bni.on .ico svg{stroke:var(--blue2);}
.bni.on .lbl{color:var(--blue2);}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--s7);display:flex;z-index:50;padding:8px 0 max(env(safe-area-inset-bottom),12px);box-shadow:0 -2px 16px rgba(0,0,0,.07);}
.notif-item{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--s7);cursor:pointer;transition:background .15s;background:#fff;align-items:flex-start;}
.notif-item.unread{background:var(--blue5);}
.notif-item:active{background:var(--s8);}
.notif-ico{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.notif-ico.awarded{background:linear-gradient(135deg,#D1FAE5,#A7F3D0);}
.notif-ico.shortlisted{background:linear-gradient(135deg,#DBEAFE,#BFDBFE);}
.notif-ico.rejected{background:linear-gradient(135deg,#FEE2E2,#FECACA);}
.notif-ico.hire_request{background:linear-gradient(135deg,#FEF3C7,#FDE68A);}
.notif-ico.new_bid{background:linear-gradient(135deg,#EDE9FE,#DDD6FE);}
.notif-ico.default{background:var(--s8);}
.notif-tit{font-family:var(--h);font-size:13px;font-weight:700;margin-bottom:3px;}
.notif-body{font-size:12px;color:var(--s3);line-height:1.55;}
.notif-time{font-size:10px;color:var(--s5);margin-top:4px;}
.unread-dot{width:8px;height:8px;border-radius:50%;background:var(--blue2);flex-shrink:0;margin-top:5px;}
</style>
</head>
<body>
<div id="loader">
  <div class="ld-icon"><img src="https://lh3.googleusercontent.com/d/16oZcVd80uLrux2B-jN84sTUlmOqGoPQd" alt="Pragati" onerror="this.style.display='none'"/></div>
  <div class="ld-brand">Pragati<span>.</span></div>
  <div class="ld-sub">Work Exchange · PragatiOne</div>
  <div class="ld-bar"><div class="ld-fill"></div></div>
</div>
<div id="toast"></div>

<div style="display:flex;flex-direction:column;min-height:100vh;">
  <div class="tbar">
    <button class="tbk" onclick="history.back()">←</button>
    <h2>Notifications</h2>
    <button class="btn btn-g btn-sm" onclick="markAllRead()">Mark all read</button>
  </div>
  <div class="pscr pb90" id="notif-list">
    <div class="empty"><div class="spin" style="margin:0 auto;"></div></div>
  </div>
  <nav class="bnav" id="bot-nav"></nav>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
<script>
var firebase_cfg={apiKey:"AIzaSyBT465A_V0oe-8wkeWk8hee7NXUBSLZcyA",authDomain:"pragati-work-exchange.firebaseapp.com",projectId:"pragati-work-exchange",storageBucket:"pragati-work-exchange.firebasestorage.app",messagingSenderId:"422215240765",appId:"1:422215240765:web:eefb239420262c9d822e54"};
if(!firebase.apps.length) firebase.initializeApp(firebase_cfg);
var auth=firebase.auth(), db=firebase.firestore(), FS=firebase.firestore;
var CU=null,CD=null,_notifs=[];
var ICON_MAP={awarded:'🏆',shortlisted:'✅',rejected:'❌',hire_request:'🤝',new_bid:'📋',default:'🔔'};

auth.onAuthStateChanged(async function(user){
  if(!user){location.href='index.html';return;}
  CU=user;
  try{var s=await db.collection('users').doc(user.uid).get();CD=s.exists?s.data():null;}catch(e){}
  if(!CD){location.href='index.html';return;}
  document.getElementById('loader').classList.add('out');
  // Build nav
  var isMain=CD.role==='main';
  document.getElementById('bot-nav').innerHTML=buildBnav(isMain,'').replace('<nav class="bnav">','').replace('</nav>','');
  loadNotifications();
});

async function loadNotifications(){
  var el=document.getElementById('notif-list');
  try{
    var snap=await db.collection('notifications').where('toUid','==',CU.uid).orderBy('createdAt','desc').limit(50).get();
    _notifs=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
  }catch(e){_notifs=[];}

  // Add demo notifications if none
  if(!_notifs.length){
    _notifs=[
      {id:'demo1',type:'shortlisted',title:'🎉 You are Shortlisted!',body:'Kalpataru Constructions shortlisted you for "Interior Plastering Work – Phase 2". Expect a final decision soon.',read:false,link:'apps.html',_demoTime:'2 hours ago'},
      {id:'demo2',type:'new_bid',title:'📋 New Bid Received',body:'Mohan Kumar submitted a quotation of ₹2,65,000 for your "Interior Plastering – Block A" work.',read:true,link:'bids.html',_demoTime:'Yesterday'},
      {id:'demo3',type:'hire_request',title:'🤝 Direct Hire Request',body:'Godrej Properties sent you a hire request for Flooring work. Respond to confirm.',read:false,link:'apps.html',_demoTime:'2 days ago'},
    ];
  }

  if(!_notifs.length){el.innerHTML=emptyHTML('🔔','All caught up!','No notifications yet. Submit bids and stay active to receive updates.');return;}

  el.innerHTML=_notifs.map(function(n){
    var t=n.type||'default';
    var ico=ICON_MAP[t]||'🔔';
    var timeStr=n._demoTime||(n.createdAt&&n.createdAt.toDate?fmtTime(n.createdAt.toDate()):'');
    return '<div class="notif-item '+(n.read?'':'unread')+'" onclick="handleNotif(\''+n.id+'\',\''+esc(n.link||'')+'\')">'+
      '<div class="notif-ico '+(n.read?'default':t)+'">'+ico+'</div>'+
      '<div style="flex:1;min-width:0;">'+
        '<div class="notif-tit">'+esc(n.title||'Notification')+'</div>'+
        '<div class="notif-body">'+esc(n.body||'')+'</div>'+
        '<div class="notif-time">'+esc(timeStr)+'</div>'+
      '</div>'+
      (!n.read?'<div class="unread-dot"></div>':'')+
    '</div>';
  }).join('');
}

async function handleNotif(id,link){
  // Mark as read
  var n=_notifs.find(function(x){return x.id===id;});
  if(n&&!n.read&&!id.startsWith('demo')){
    try{await db.collection('notifications').doc(id).update({read:true});}catch(e){}
  }
  if(link) location.href=link;
}

async function markAllRead(){
  var unread=_notifs.filter(function(n){return !n.read&&!n.id.startsWith('demo');});
  var batch=db.batch();
  unread.forEach(function(n){batch.update(db.collection('notifications').doc(n.id),{read:true});});
  try{await batch.commit();}catch(e){}
  _notifs.forEach(function(n){n.read=true;});
  loadNotifications();
  toast('All marked as read','ok');
}

function fmtTime(d){
  var now=new Date();
  var diff=(now-d)/1000;
  if(diff<60) return 'Just now';
  if(diff<3600) return Math.floor(diff/60)+' min ago';
  if(diff<86400) return Math.floor(diff/3600)+' hr ago';
  if(diff<172800) return 'Yesterday';
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
}
</script>
</body>
</html>
