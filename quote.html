<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<meta name="theme-color" content="#1D4ED8"/>
<title>Submit Quotation — Pragati Work Exchange</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="loader">
  <div class="ld-icon"><img src="https://lh3.googleusercontent.com/d/16oZcVd80uLrux2B-jN84sTUlmOqGoPQd" alt="Pragati" onerror="this.style.display='none'"/></div>
  <div class="ld-brand">Pragati<span>.</span></div>
  <div class="ld-sub">Work Exchange · PragatiOne</div>
  <div class="ld-bar"><div class="ld-fill"></div></div>
</div>
<div id="toast"></div>

<div style="display:flex;flex-direction:column;min-height:100vh;">
  <div class="tbar"><button class="tbk" onclick="history.back()">←</button><h2>Submit Quotation</h2></div>
  <div class="pscr" style="padding:14px 16px 100px;">
    <div id="work-ref" style="background:var(--blue5);border:1px solid #BFDBFE;border-radius:13px;padding:13px;margin-bottom:18px;">
      <div style="font-family:var(--h);font-size:13px;font-weight:700;color:var(--blue2);margin-bottom:5px;" id="q-wt">—</div>
      <div style="display:flex;gap:12px;font-size:12px;color:var(--s3);flex-wrap:wrap;"><span id="q-wco">—</span><span id="q-wloc">—</span><span id="q-wbud" style="color:var(--green2);font-weight:700;">—</span></div>
    </div>
    <div class="slbl"><div class="snm">1</div>Your Price</div>
    <div class="g2">
      <div class="field"><label class="flbl">Quote Amount (₹) *</label><input class="fin" id="q-amt" type="number" placeholder="275000" inputmode="numeric"/></div>
      <div class="field"><label class="flbl">Timeline (Days) *</label><input class="fin" id="q-days" type="number" placeholder="40" inputmode="numeric"/></div>
    </div>
    <div class="field"><label class="flbl">Labour Count</label><input class="fin" id="q-lab" type="number" placeholder="9" inputmode="numeric"/></div>
    <div class="slbl"><div class="snm">2</div>Your Pitch</div>
    <div class="field"><label class="flbl">Why choose you? *</label><textarea class="fin" id="q-pitch" rows="4" placeholder="Describe your experience, past projects, quality standards…"></textarea></div>
    <div class="slbl"><div class="snm">3</div>Payment Terms</div>
    <div class="field"><label class="flbl">Terms</label><select class="fin" id="q-terms"><option>30% advance · 40% mid · 30% completion</option><option>50% advance · 50% completion</option><option>100% on completion</option><option>Custom terms</option></select></div>
    <div class="slbl"><div class="snm">4</div>Attachments (Optional)</div>
    <div class="field">
      <label class="attach-zone" onclick="document.getElementById('q-files').click()">
        <span style="font-size:28px;">📎</span>
        <span id="q-att-lbl" style="font-size:13px;font-weight:600;color:var(--s3);">Tap to upload files</span>
        <span style="font-size:11px;color:var(--s5);">PDF, JPG, PNG · Max 10MB</span>
      </label>
      <input type="file" id="q-files" multiple accept=".pdf,.jpg,.jpeg,.png" style="display:none;" onchange="showFiles(this)"/>
      <div id="q-att-list" style="margin-top:8px;display:flex;flex-direction:column;gap:6px;"></div>
    </div>
    <div class="ferr" id="q-err"></div>
    <button class="btn btn-p btn-bl btn-lg" id="q-btn" onclick="submitQuote()" style="margin-top:8px;">Submit Quotation →</button>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
<script>

const firebase_cfg = {
  apiKey:"AIzaSyBT465A_V0oe-8wkeWk8hee7NXUBSLZcyA",
  authDomain:"pragati-work-exchange.firebaseapp.com",
  projectId:"pragati-work-exchange",
  storageBucket:"pragati-work-exchange.firebasestorage.app",
  messagingSenderId:"422215240765",
  appId:"1:422215240765:web:eefb239420262c9d822e54"
};
if(!firebase.apps.length) firebase.initializeApp(firebase_cfg);
const auth = firebase.auth();
const db   = firebase.firestore();
const FS   = firebase.firestore;
var CU=null, CD=null;
auth.onAuthStateChanged(async function(user){
  if(!user){location.href='index.html';return;}
  CU=user;
  try{var s=await db.collection('users').doc(user.uid).get(); CD=s.exists?s.data():null;}catch(e){}
  if(!CD){location.href='index.html';return;}
  if(cd && cd.role==='main'){location.href='main.html';return;}
  document.getElementById('loader').classList.add('out');
  loadQuote();
});

function toast(msg,type){
  var el=document.getElementById('toast'); el.textContent=msg;
  el.className=type?'on '+type:'on'; setTimeout(function(){el.className='';},3000);
}
function getP(k){return new URLSearchParams(window.location.search).get(k);}
function saveLS(k,v){try{localStorage.setItem('pg_'+k,JSON.stringify(v));}catch(e){}}
function getLS(k){try{return JSON.parse(localStorage.getItem('pg_'+k));}catch(e){return null;}}
function clearLS(k){localStorage.removeItem('pg_'+k);}
function fmtBud(w){
  var f=function(n){return n>=100000?'₹'+(n/100000).toFixed(1).replace('.0','')+'L':'₹'+n.toLocaleString('en-IN');};
  return(w.minBudget&&w.maxBudget)?f(w.minBudget)+'–'+f(w.maxBudget):w.minBudget?f(w.minBudget):'TBD';
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function initials(n){return(n||'U').split(' ').map(function(x){return x[0];}).join('').toUpperCase().slice(0,2);}
function tagClr(u){return u==='Urgent'?'t-or':u==='Critical'?'t-re':'t-gr';}
function emptyHTML(ico,t,s){return '<div class="empty"><div class="ei">'+ico+'</div><h3>'+t+'</h3><p>'+s+'</p></div>';}
function mkCard(w){
  return '<div class="wcard" onclick="goDetail('+JSON.stringify(w.id)+')">'+
    '<div class="wh"><div class="tags"><span class="tag t-bl">'+esc(w.trade||'General')+'</span>'+
    '<span class="tag '+tagClr(w.urgency)+'">'+esc(w.urgency||'Normal')+'</span></div>'+
    '<div class="wt">'+esc(w.title)+'</div>'+
    '<div class="wco">🏢 '+esc(w.company||w.postedByName||'Main Contractor')+'</div></div>'+
    '<div class="wb"><div class="wmeta"><span>📍 '+esc(w.location||'—')+'</span>'+
    '<span>⏱ '+esc(w.startDate||'TBD')+'</span>'+
    '<span>👷 '+esc(w.experience||'—')+'</span></div></div>'+
    '<div class="wf"><span class="wbud">'+fmtBud(w)+'</span>'+
    '<span class="wbids">'+(w.bids||0)+' bids</span></div></div>';
}
</script>
<script>
var CW=null;
async function loadQuote(){
  CW=getLS('currentWork');
  var id=getP('id');
  if(!CW&&id){
    try{var s=await db.collection('works').doc(id).get();CW=s.exists?Object.assign({id:s.id},s.data()):null;}catch(e){}
    if(!CW) CW=DEMO_WORKS.find(function(w){return w.id===id;});
  }
  if(CW){
    document.getElementById('q-wt').textContent=CW.title||'—';
    document.getElementById('q-wco').textContent='🏢 '+(CW.company||CW.postedByName||'');
    document.getElementById('q-wloc').textContent='📍 '+(CW.location||'');
    document.getElementById('q-wbud').textContent=fmtBud(CW);
  }
}
async function submitQuote(){
  var amt=document.getElementById('q-amt').value, days=document.getElementById('q-days').value,
      pitch=document.getElementById('q-pitch').value.trim();
  var err=document.getElementById('q-err'), btn=document.getElementById('q-btn');
  err.textContent=''; err.classList.remove('on');
  if(!amt||!days||!pitch){err.textContent='Please fill amount, days and pitch.'; err.classList.add('on');return;}
  if(!CW){err.textContent='Work not found. Please go back.'; err.classList.add('on');return;}
  btn.classList.add('btn-ld'); btn.textContent='Submitting…';
  try{
    await db.collection('applications').add({
      workId:CW.id, workTitle:CW.title, workCompany:CW.company||CW.postedByName||'',
      workLocation:CW.location||'', postedBy:CW.postedBy||'',
      applicantId:CU.uid, applicantName:CD.name||'', applicantPhone:CD.phone||'',
      amount:Number(amt), days:Number(days), labour:document.getElementById('q-lab').value||'',
      pitch:pitch, terms:document.getElementById('q-terms').value,
      status:'pending', createdAt:FS.FieldValue.serverTimestamp()
    });
    try{await db.collection('works').doc(CW.id).update({bids:FS.FieldValue.increment(1)});}catch(e){}
    toast('Quotation submitted! 🎉','ok');
    clearLS('currentWork');
    setTimeout(function(){location.href='apps.html';},1200);
  }catch(e){err.textContent='Error: '+e.message; err.classList.add('on'); btn.classList.remove('btn-ld'); btn.textContent='Submit Quotation →';}
}
function showFiles(input){
  var list=document.getElementById('q-att-list'); list.innerHTML='';
  Array.from(input.files).forEach(function(f){
    var div=document.createElement('div'); div.className='attach-file';
    var ico=f.type.includes('pdf')?'📄':'🖼️';
    div.innerHTML='<span style="font-size:18px;">'+ico+'</span><div style="flex:1;"><div style="font-weight:600;">'+esc(f.name)+'</div><div style="font-size:11px;color:var(--s4);">'+(f.size/1024).toFixed(0)+'KB</div></div><span style="color:var(--green2);">✓</span>';
    list.appendChild(div);
  });
  if(input.files.length) document.getElementById('q-att-lbl').textContent=input.files.length+' file(s) selected';
}
function goDetail(id){location.href='detail.html?id='+id;}
</script>
</body></html>
