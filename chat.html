<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<meta name="theme-color" content="#1D4ED8"/>
<title>Messages — Pragati Work Exchange</title>
<link rel="stylesheet" href="style.css"/>
<style>
.bni .ico svg { display:block; transition:transform .2s; }
.bni.on .ico svg { stroke:var(--blue2); transform:scale(1.12); }
.bni .ico { display:flex; align-items:center; justify-content:center; font-size:22px; }
.bni .lbl { font-size:10px; font-weight:600; color:var(--s5); margin-top:1px; }
.bni.on .lbl { color:var(--blue2); }
</style>
</head>
<body>
<div id="loader">
  <div class="ld-icon"><img src="https://lh3.googleusercontent.com/d/16oZcVd80uLrux2B-jN84sTUlmOqGoPQd" alt="Pragati" onerror="this.style.display='none'"/></div>
  <div class="ld-brand">Pragati<span>.</span></div>
  <div class="ld-sub">Work Exchange · PragatiOne</div>
  <div class="ld-bar"><div class="ld-fill"></div></div>
</div>
<div id="toast"></div>

<style>
body{overflow:hidden;height:100vh;}
#view-list{display:flex;flex-direction:column;height:100vh;}
#list-scroll{flex:1;overflow-y:auto;background:#fff;padding-bottom:80px;}
#list-scroll::-webkit-scrollbar{display:none;}
#view-chat{display:none;flex-direction:column;position:fixed;inset:0;background:var(--s9);z-index:200;}
#view-chat.open{display:flex;}
.ch-hdr{background:#fff;border-bottom:1px solid var(--s7);padding:48px 14px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 1px 8px rgba(0,0,0,.06);}
.ch-av{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--h);font-size:14px;font-weight:700;flex-shrink:0;}
.ch-info{flex:1;min-width:0;}
.ch-name{font-family:var(--h);font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ch-stat{font-size:11px;color:var(--green2);display:flex;align-items:center;gap:4px;margin-top:1px;}
.odot{width:7px;height:7px;border-radius:50%;background:var(--green2);animation:pd 2s infinite;}
@keyframes pd{0%,100%{opacity:1}50%{opacity:.4}}
#msg-area{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:4px;background:var(--s9);}
#msg-area::-webkit-scrollbar{display:none;}
.mtime{text-align:center;font-size:11px;color:var(--s5);background:rgba(148,163,184,.15);padding:3px 14px;border-radius:20px;align-self:center;margin:6px 0;}
.msg{max-width:78%;padding:10px 12px;border-radius:16px;font-size:14px;line-height:1.55;word-break:break-word;animation:mi .18s ease;}
@keyframes mi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.msg.them{background:#fff;border:1px solid var(--s7);border-bottom-left-radius:4px;align-self:flex-start;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.msg.me{background:var(--blue2);color:#fff;border-bottom-right-radius:4px;align-self:flex-end;box-shadow:0 2px 8px rgba(37,99,235,.22);}
.mmeta{font-size:10px;display:block;margin-top:3px;opacity:.65;}
.msg.me .mmeta{text-align:right;color:rgba(255,255,255,.8);}
.msg.them .mmeta{color:var(--s4);}
#typing-row{display:none;align-self:flex-start;margin:4px 0;}
.tdots{background:#fff;border:1px solid var(--s7);border-radius:14px;border-bottom-left-radius:4px;padding:10px 14px;display:flex;gap:5px;}
.tdots span{width:7px;height:7px;border-radius:50%;background:var(--s5);animation:td .9s infinite;}
.tdots span:nth-child(2){animation-delay:.22s;} .tdots span:nth-child(3){animation-delay:.44s;}
@keyframes td{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.ch-input{background:#fff;border-top:1px solid var(--s7);padding:10px 12px 28px;display:flex;gap:8px;align-items:flex-end;flex-shrink:0;}
#msg-inp{flex:1;background:var(--s8);border:1.5px solid var(--s7);border-radius:22px;padding:10px 14px;font-size:14px;color:var(--s0);font-family:var(--b);outline:none;transition:.2s;resize:none;min-height:42px;max-height:120px;line-height:1.4;overflow-y:auto;}
#msg-inp:focus{border-color:var(--blue2);background:#fff;}
#msg-inp::placeholder{color:var(--s5);}
.ib{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s;}
.ib:active{transform:scale(.9);}
.ib-att{background:var(--s8);border:1.5px solid var(--s7);font-size:18px;}
.ib-snd{background:var(--blue2);box-shadow:0 3px 12px rgba(37,99,235,.3);}
.cli{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--s7);cursor:pointer;transition:background .15s;align-items:center;background:#fff;}
.cli:active{background:var(--s8);}
.cli-av{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-family:var(--h);font-size:16px;font-weight:700;flex-shrink:0;}
.cli-info{flex:1;min-width:0;}
.cli-name{font-size:14px;font-weight:600;margin-bottom:3px;}
.cli-prev{font-size:12px;color:var(--s4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cli-r{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
.cli-time{font-size:10px;color:var(--s5);}
.cli-unread{background:var(--blue2);color:#fff;font-size:10px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;}
.ch-srch{padding:10px 16px;background:#fff;border-bottom:1px solid var(--s7);flex-shrink:0;}
.srch-w{position:relative;}
.srch-w::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none;}
.srch-w input{width:100%;background:var(--s8);border:1.5px solid var(--s7);border-radius:22px;padding:9px 14px 9px 36px;font-size:13px;color:var(--s0);font-family:var(--b);outline:none;transition:.2s;}
.srch-w input:focus{border-color:var(--blue2);background:#fff;}
</style>
<div id="view-list">
  <div class="tbar" style="padding-top:48px;"><button class="tbk" onclick="history.back()">←</button><h2>Messages</h2></div>
  <div class="ch-srch"><div class="srch-w"><input type="text" id="srch" placeholder="Search conversations…" oninput="filterConvos()"/></div></div>
  <div id="list-scroll"></div>
  <nav class="bnav n4" id="chat-bnav"></nav>
</div>
<div id="view-chat">
  <div class="ch-hdr">
    <button class="tbk" onclick="closeChat()">←</button>
    <div class="ch-av" id="ch-av">?</div>
    <div class="ch-info"><div class="ch-name" id="ch-name">—</div><div class="ch-stat"><span class="odot"></span><span>Online</span></div></div>
    <button class="tbk" onclick="handleCall()">📞</button>
  </div>
  <div id="msg-area"></div>
  <div id="typing-row"><div class="tdots"><span></span><span></span><span></span></div></div>
  <div class="ch-input">
    <label class="ib ib-att" for="att-inp" title="Attach">📎</label>
    <input type="file" id="att-inp" style="display:none;" accept="image/*,.pdf" onchange="sendFile(this)"/>
    <textarea id="msg-inp" placeholder="Type a message…" rows="1"></textarea>
    <button class="ib ib-snd" id="snd-btn"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2L15 22L11 13L2 9L22 2Z" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
<script>

const firebase_cfg = {
  apiKey:"AIzaSyBT465A_V0oe-8wkeWk8hee7NXUBSLZcyA",
  authDomain:"pragati-work-exchange.firebaseapp.com",
  projectId:"pragati-work-exchange",
  storageBucket:"pragati-work-exchange.firebasestorage.app",
  messagingSenderId:"422215240765",
  appId:"1:422215240765:web:eefb239420262c9d822e54"
};
if(!firebase.apps.length) firebase.initializeApp(firebase_cfg);
const auth = firebase.auth();
const db   = firebase.firestore();
const FS   = firebase.firestore;
var CU=null,CD=null,activeChatId=null,activeOtherId=null,activeOtherName=null,msgUnsub=null,allConvos=[];
var AUTO_REPLIES=['Got it, thanks! We will get back to you shortly.','Understood. Please confirm the site visit time.','Yes that works for us.','Can you also share your experience certificate?','We will review and let you know soon.','Noted. Our engineer will call you tomorrow.','Perfect. Please bring all relevant documents.','Okay, we have noted this. Thank you!'];

auth.onAuthStateChanged(async function(user){
  if(!user){location.href='index.html';return;}
  CU=user;
  try{var s=await db.collection('users').doc(user.uid).get();CD=s.exists?s.data():null;}catch(e){}
  if(!CD){location.href='index.html';return;}
  document.getElementById('loader').classList.add('out');
  _isMain = CD && CD.role==='main';
  buildBnav();
  await loadConvos();
  // Auto-open if redirected from bids/detail
  var target=getLS('chatTarget');
  if(target&&target.uid){
    clearLS('chatTarget');
    var ex=allConvos.find(function(c){return (c.participants||[]).includes(target.uid);});
    if(ex){
      setTimeout(function(){openChat(ex.id,target.uid,target.name||ex.participantNames&&ex.participantNames[target.uid]||'Contractor');},200);
    } else {
      // Create conversation then open
      try{
        var ref=await db.collection('conversations').add({
          participants:[CU.uid,target.uid],
          participantNames:{[CU.uid]:CD.name||'Me',[target.uid]:target.name||'Contractor'},
          workId:target.workId||'', workTitle:target.workTitle||'',
          lastMsg:'', lastMsgTime:firebase.firestore.FieldValue.serverTimestamp(),
          unread:{[CU.uid]:0,[target.uid]:0}, createdAt:firebase.firestore.FieldValue.serverTimestamp()
        });
        await loadConvos();
        setTimeout(function(){openChat(ref.id,target.uid,target.name||'Contractor');},200);
      }catch(e){}
    }
  }
});

function buildBnav(){
  var isMain=CD&&CD.role==='main';
  document.getElementById('chat-bnav').innerHTML = (isMain ? [
    {href:'main.html',ico:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>',lbl:'Home'},
    {href:'post.html',ico:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',lbl:'Post Work'},
    {href:'myworks.html',ico:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/><path d="M12 12v4M10 14h4"/></svg>',lbl:'My Works'},
  ] : [
    {href:'home.html',ico:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>',lbl:'Home'},
    {href:'find.html',ico:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>',lbl:'Find Work'},
    {href:'apps.html',ico:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>',lbl:'My Bids'},
  ]).map(function(it){return '<div class="bni" onclick="location.href=\''+it.href+'\'"><div class="ico">'+it.ico+'</div><div class="lbl">'+it.lbl+'</div></div>';}).join('')+
  '<div class="bni on"><div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></div><div class="lbl">Messages</div></div>';
}

async function loadConvos(){
  try{
    var snap=await db.collection('conversations').where('participants','array-contains',CU.uid).orderBy('lastMsgTime','desc').get();
    allConvos=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
  }catch(e){
    try{
      var snap2=await db.collection('conversations').where('participants','array-contains',CU.uid).get();
      allConvos=snap2.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    }catch(e2){allConvos=[];}
  }
  renderConvoList(allConvos);
}

function avatarStyle(name){
  var bgs=['rgba(37,99,235,.15)','rgba(16,185,129,.15)','rgba(249,115,22,.15)','rgba(124,58,237,.15)','rgba(220,38,38,.12)'];
  var fgs=['var(--blue2)','var(--green2)','var(--orange2)','#7C3AED','var(--red2)'];
  var i=(name||'').charCodeAt(0)%bgs.length;
  return {bg:bgs[i],color:fgs[i]};
}
function fmtTime(ts){
  if(!ts) return '';
  var d=ts.toDate?ts.toDate():new Date(ts);
  var now=new Date(), diff=(now-d)/1000;
  if(diff<86400) return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
  if(diff<172800) return 'Yesterday';
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
}
function nowTime(){var d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}

function renderConvoList(convos){
  var el=document.getElementById('list-scroll');
  if(!convos.length){
    el.innerHTML='<div class="empty"><div class="ei">💬</div><h3>No messages yet</h3><p>Start a conversation by tapping 💬 on any work or bid.</p></div>';
    return;
  }
  el.innerHTML=convos.map(function(c){
    var otherId=c.participants.find(function(p){return p!==CU.uid;});
    var otherName=(c.participantNames&&c.participantNames[otherId])||'Contractor';
    var s=avatarStyle(otherName);
    var ini=initials(otherName);
    var unread=(c.unread&&c.unread[CU.uid])||0;
    return '<div class="cli" onclick="openChatLS(this)" data-cid="'+c.id+'" data-uid="'+otherId+'" data-nm="'+esc(otherName)+'">'+
      '<div class="cli-av" style="background:'+s.bg+';color:'+s.color+';">'+ini+'</div>'+
      '<div class="cli-info"><div class="cli-name">'+esc(otherName)+'</div>'+
      '<div class="cli-prev">'+(c.workTitle?'['+esc(c.workTitle)+'] ':'')+esc(c.lastMsg||'Start a conversation…')+'</div></div>'+
      '<div class="cli-r"><div class="cli-time">'+fmtTime(c.lastMsgTime)+'</div>'+
      (unread>0?'<div class="cli-unread">'+unread+'</div>':'')+
      '</div></div>';
  }).join('');
}

function openChatLS(el){openChat(el.dataset.cid, el.dataset.uid, el.dataset.nm);}
function filterConvos(){
  var q=document.getElementById('srch').value.toLowerCase();
  if(!q){renderConvoList(allConvos);return;}
  renderConvoList(allConvos.filter(function(c){
    var otherId=c.participants.find(function(p){return p!==CU.uid;});
    var nm=((c.participantNames&&c.participantNames[otherId])||'').toLowerCase();
    return nm.includes(q)||(c.lastMsg||'').toLowerCase().includes(q)||(c.workTitle||'').toLowerCase().includes(q);
  }));
}

function openChat(chatId,otherId,otherName){
  activeChatId=chatId; activeOtherId=otherId; activeOtherName=otherName;
  var s=avatarStyle(otherName);
  var av=document.getElementById('ch-av');
  av.textContent=initials(otherName); av.style.background=s.bg; av.style.color=s.color;
  document.getElementById('ch-name').textContent=otherName;
  document.getElementById('view-chat').classList.add('open');
  document.getElementById('msg-area').innerHTML='<div class="mtime">Loading…</div>';
  // Clear unread
  try{
    var upd={};upd['unread.'+CU.uid]=0;
    db.collection('conversations').doc(chatId).update(upd);
  }catch(e){}
  loadConvos();
  // Real-time messages
  if(msgUnsub) msgUnsub();
  msgUnsub=db.collection('conversations').doc(chatId).collection('messages')
    .orderBy('createdAt','asc')
    .onSnapshot(function(snap){
      renderMsgs(snap.docs.map(function(d){return Object.assign({id:d.id},d.data());}));
    },function(err){
      // Fallback without ordering
      db.collection('conversations').doc(chatId).collection('messages').get().then(function(s2){
        var msgs=s2.docs.map(function(d){return Object.assign({id:d.id},d.data());});
        msgs.sort(function(a,b){return (a.createdAt&&a.createdAt.toMillis?a.createdAt.toMillis():0)-(b.createdAt&&b.createdAt.toMillis?b.createdAt.toMillis():0);});
        renderMsgs(msgs);
      });
    });
  setTimeout(function(){document.getElementById('msg-inp').focus();},300);
}

function renderMsgs(msgs){
  var wrap=document.getElementById('msg-area');
  wrap.innerHTML='<div class="mtime">Today</div>';
  msgs.forEach(function(m){
    var div=document.createElement('div');
    div.className='msg '+(m.senderId===CU.uid?'me':'them');
    var t=m.createdAt&&m.createdAt.toDate?fmtTime(m.createdAt):nowTime();
    div.innerHTML=esc(m.text||'')+'<span class="mmeta">'+t+(m.senderId===CU.uid?' ✓✓':'')+'</span>';
    wrap.appendChild(div);
  });
  setTimeout(function(){wrap.scrollTop=wrap.scrollHeight;},50);
}

function closeChat(){
  if(msgUnsub){msgUnsub();msgUnsub=null;}
  activeChatId=null;
  document.getElementById('view-chat').classList.remove('open');
  document.getElementById('msg-inp').value=''; resizeInp();
  loadConvos();
}

async function sendMsg(){
  var inp=document.getElementById('msg-inp');
  var txt=inp.value.trim();
  if(!txt||!activeChatId)return;
  inp.value=''; resizeInp();
  try{
    await db.collection('conversations').doc(activeChatId).collection('messages').add({
      text:txt, senderId:CU.uid, senderName:CD.name||'Me',
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    var upd={lastMsg:txt,lastMsgTime:firebase.firestore.FieldValue.serverTimestamp()};
    upd['unread.'+activeOtherId]=firebase.firestore.FieldValue.increment(1);
    await db.collection('conversations').doc(activeChatId).update(upd);
  }catch(e){toast('Could not send: '+e.message,'err');inp.value=txt;resizeInp();return;}
  // Show typing + auto reply
  var ti=document.getElementById('typing-row');
  ti.style.display='block';
  document.getElementById('msg-area').scrollTop=99999;
  setTimeout(async function(){
    ti.style.display='none';
    if(activeChatId===null)return;
    var reply=AUTO_REPLIES[Math.floor(Math.random()*AUTO_REPLIES.length)];
    try{
      await db.collection('conversations').doc(activeChatId).collection('messages').add({
        text:reply, senderId:activeOtherId, senderName:activeOtherName||'Contractor',
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      await db.collection('conversations').doc(activeChatId).update({lastMsg:reply,lastMsgTime:firebase.firestore.FieldValue.serverTimestamp()});
    }catch(e){}
  },1400+Math.random()*800);
}

function sendFile(input){
  if(!input.files.length||!activeChatId)return;
  var file=input.files[0], t=nowTime(), wrap=document.getElementById('msg-area');
  if(file.type.startsWith('image/')){
    var reader=new FileReader();
    reader.onload=function(e){
      var div=document.createElement('div');div.className='msg me';div.style.padding='4px';
      div.innerHTML='<img src="'+e.target.result+'" style="max-width:200px;border-radius:10px;display:block;"/><span class="mmeta" style="padding:0 6px 4px;">'+t+' ✓</span>';
      wrap.appendChild(div);wrap.scrollTop=wrap.scrollHeight;toast('Image sent!','ok');
    };
    reader.readAsDataURL(file);
  } else {
    var div=document.createElement('div');div.className='msg me';
    div.innerHTML='📎 '+esc(file.name)+'<span class="mmeta">'+t+' ✓</span>';
    wrap.appendChild(div);wrap.scrollTop=wrap.scrollHeight;toast('File sent!','ok');
  }
  input.value='';
}

function handleCall(){toast('Calling '+(activeOtherName||'')+'…','ok');}
function resizeInp(){var el=document.getElementById('msg-inp');el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}
function toast(msg,type){var el=document.getElementById('toast');el.textContent=msg;el.className=type?'on '+type:'on';setTimeout(function(){el.className='';},3000);}
function getLS(k){try{return JSON.parse(localStorage.getItem('pg_'+k));}catch(e){return null;}}
function clearLS(k){localStorage.removeItem('pg_'+k);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function initials(n){return(n||'U').split(' ').map(function(x){return x[0];}).join('').toUpperCase().slice(0,2);}
function avatarStyle(name){var bgs=['rgba(37,99,235,.15)','rgba(16,185,129,.15)','rgba(249,115,22,.15)','rgba(124,58,237,.15)','rgba(220,38,38,.12)'];var fgs=['var(--blue2)','var(--green2)','var(--orange2)','#7C3AED','var(--red2)'];var i=(name||'').charCodeAt(0)%bgs.length;return{bg:bgs[i],color:fgs[i]};}
function fmtTime(ts){if(!ts)return'';var d=ts.toDate?ts.toDate():new Date(ts);var now=new Date(),diff=(now-d)/1000;if(diff<86400)return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');if(diff<172800)return'Yesterday';return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});}
function nowTime(){var d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
