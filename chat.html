<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<meta name="theme-color" content="#1D4ED8"/>
<title>Messages — Pragati Work Exchange</title>
<link rel="stylesheet" href="style.css"/>
<style>
body{overflow:hidden;height:100vh;}

/* ── CHAT LIST VIEW ── */
#view-list{display:flex;flex-direction:column;height:100vh;}
#list-scroll{flex:1;overflow-y:auto;background:#fff;padding-bottom:80px;}
#list-scroll::-webkit-scrollbar{display:none;}

/* ── CHAT WINDOW ── */
#view-chat{display:none;flex-direction:column;position:fixed;inset:0;background:var(--s9);z-index:200;}
#view-chat.open{display:flex;}

/* Header */
.ch-hdr{background:#fff;border-bottom:1px solid var(--s7);padding:48px 14px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 1px 8px rgba(0,0,0,.06);}
.ch-av{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--h);font-size:14px;font-weight:700;flex-shrink:0;}
.ch-info{flex:1;min-width:0;}
.ch-name{font-family:var(--h);font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ch-status{font-size:11px;color:var(--green2);display:flex;align-items:center;gap:4px;margin-top:1px;}
.odot{width:7px;height:7px;border-radius:50%;background:var(--green2);animation:pd 2s infinite;}
@keyframes pd{0%,100%{opacity:1}50%{opacity:.4}}

/* Messages */
#msg-area{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:4px;}
#msg-area::-webkit-scrollbar{display:none;}
.mtime{text-align:center;font-size:11px;color:var(--s5);background:rgba(148,163,184,.15);padding:3px 14px;border-radius:20px;align-self:center;margin:6px 0;}
.msg{max-width:78%;padding:10px 12px;border-radius:16px;font-size:14px;line-height:1.55;word-break:break-word;animation:mi .18s ease;}
@keyframes mi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.msg.them{background:#fff;border:1px solid var(--s7);border-bottom-left-radius:4px;align-self:flex-start;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.msg.me{background:var(--blue2);color:#fff;border-bottom-right-radius:4px;align-self:flex-end;box-shadow:0 2px 8px rgba(37,99,235,.22);}
.mmeta{font-size:10px;display:block;margin-top:3px;opacity:.65;}
.msg.me .mmeta{text-align:right;color:rgba(255,255,255,.8);}
.msg.them .mmeta{color:var(--s4);}

/* Typing dots */
#typing-row{display:none;align-self:flex-start;margin-left:2px;}
.tdots{background:#fff;border:1px solid var(--s7);border-radius:14px;border-bottom-left-radius:4px;padding:10px 14px;display:flex;gap:5px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.tdots span{width:7px;height:7px;border-radius:50%;background:var(--s5);animation:td .9s infinite;}
.tdots span:nth-child(2){animation-delay:.22s;}
.tdots span:nth-child(3){animation-delay:.44s;}
@keyframes td{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

/* Input bar */
.ch-input{background:#fff;border-top:1px solid var(--s7);padding:10px 12px 28px;display:flex;gap:8px;align-items:flex-end;flex-shrink:0;}
#msg-inp{flex:1;background:var(--s8);border:1.5px solid var(--s7);border-radius:22px;padding:10px 14px;font-size:14px;color:var(--s0);font-family:var(--b);outline:none;transition:.2s;resize:none;min-height:42px;max-height:120px;line-height:1.4;overflow-y:auto;}
#msg-inp:focus{border-color:var(--blue2);background:#fff;}
#msg-inp::placeholder{color:var(--s5);}
.ib{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s;}
.ib:active{transform:scale(.9);}
.ib-att{background:var(--s8);border:1.5px solid var(--s7);font-size:18px;}
.ib-snd{background:var(--blue2);box-shadow:0 3px 12px rgba(37,99,235,.3);}

/* Chat list item */
.cli{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--s7);cursor:pointer;transition:background .15s;align-items:center;}
.cli:active{background:var(--s8);}
.cli-av{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-family:var(--h);font-size:16px;font-weight:700;flex-shrink:0;}
.cli-info{flex:1;min-width:0;}
.cli-name{font-size:14px;font-weight:600;margin-bottom:3px;color:var(--s0);}
.cli-prev{font-size:12px;color:var(--s4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cli-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
.cli-time{font-size:10px;color:var(--s5);}
.cli-unread{background:var(--blue2);color:#fff;font-size:10px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;}

/* Search */
.ch-srch{padding:10px 16px;background:#fff;border-bottom:1px solid var(--s7);flex-shrink:0;}
.srch-w{position:relative;}
.srch-w::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none;}
.srch-w input{width:100%;background:var(--s8);border:1.5px solid var(--s7);border-radius:22px;padding:9px 14px 9px 36px;font-size:13px;color:var(--s0);font-family:var(--b);outline:none;transition:.2s;}
.srch-w input:focus{border-color:var(--blue2);background:#fff;}

/* Empty / Loading */
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;}
.chat-empty .ei{font-size:48px;margin-bottom:14px;opacity:.35;}
.chat-empty h3{font-family:var(--h);font-size:17px;font-weight:700;color:var(--s3);margin-bottom:6px;}
.chat-empty p{font-size:13px;color:var(--s4);line-height:1.6;}
</style>
</head>
<body>

<div id="loader">
  <div class="ld-icon"><img src="https://lh3.googleusercontent.com/d/16oZcVd80uLrux2B-jN84sTUlmOqGoPQd" alt="Pragati" onerror="this.style.display='none'"/></div>
  <div class="ld-brand">Pragati<span>.</span></div>
  <div class="ld-sub">Work Exchange</div>
  <div class="ld-bar"><div class="ld-fill"></div></div>
</div>
<div id="toast"></div>

<!-- ═══ CHAT LIST ═══ -->
<div id="view-list">
  <div class="tbar" style="padding-top:48px;">
    <button class="tbk" onclick="history.back()">←</button>
    <h2>Messages</h2>
    <button class="tbk" id="new-chat-btn" title="Start new conversation">✏️</button>
  </div>
  <div class="ch-srch">
    <div class="srch-w">
      <input type="text" id="srch-inp" placeholder="Search conversations…" oninput="filterList()"/>
    </div>
  </div>
  <div id="list-scroll">
    <div class="chat-empty">
      <div class="spin" style="margin:0 auto 16px;"></div>
      <p style="font-size:13px;color:var(--s4);">Loading conversations…</p>
    </div>
  </div>
  <nav class="bnav n4" id="bnav-list"></nav>
</div>

<!-- ═══ CHAT WINDOW ═══ -->
<div id="view-chat">
  <div class="ch-hdr">
    <button class="tbk" onclick="closeChat()">←</button>
    <div class="ch-av" id="ch-av">?</div>
    <div class="ch-info">
      <div class="ch-name" id="ch-name">—</div>
      <div class="ch-status"><span class="odot"></span><span id="ch-sub">Online</span></div>
    </div>
    <button class="tbk" onclick="handleCall()">📞</button>
  </div>
  <div id="msg-area"></div>
  <div id="typing-row"><div class="tdots"><span></span><span></span><span></span></div></div>
  <div class="ch-input">
    <label class="ib ib-att" for="att-inp" title="Attach file">📎</label>
    <input type="file" id="att-inp" style="display:none;" accept="image/*,.pdf" onchange="sendAttachment(this)"/>
    <textarea id="msg-inp" placeholder="Type a message…" rows="1"></textarea>
    <button class="ib ib-snd" id="snd-btn">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
        <path d="M22 2L11 13M22 2L15 22L11 13L2 9L22 2Z" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</div>

<script src="shared.js"></script>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{
  getFirestore,
  collection,addDoc,getDocs,getDoc,doc,setDoc,updateDoc,
  query,where,orderBy,onSnapshot,serverTimestamp,limit
}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const fbApp = initializeApp(FB_CFG);
const auth  = getAuth(fbApp);
const db    = getFirestore(fbApp);

let CU = null, CD = null;
let activeChatId  = null;   // current open chat doc id
let activeOtherId = null;   // other user's uid
let activeOtherName = null;
let msgUnsubscribe = null;  // real-time listener cleanup
let allConvos = [];         // cached conversation list

const AUTO_REPLIES = [
  'Got it, we will get back to you shortly.',
  'Understood. Please confirm the site visit time.',
  'Yes that works for us.',
  'Can you share your experience certificate as well?',
  'We will review and let you know soon.',
  'Noted. Our site engineer will call you tomorrow.',
  'Perfect. Please bring all relevant documents.',
  'Okay, we have noted your availability.',
  'Thank you for the quick response!',
  'Sure, we will arrange accordingly.',
];

// ── UTILS ──
function now() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function avatarColor(name) {
  const colors = ['rgba(37,99,235,.15)','rgba(16,185,129,.15)','rgba(249,115,22,.15)','rgba(124,58,237,.15)','rgba(220,38,38,.12)'];
  const fgColors = ['var(--blue2)','var(--green2)','var(--orange2)','#7C3AED','var(--red2)'];
  const idx = name ? name.charCodeAt(0) % colors.length : 0;
  return { bg: colors[idx], color: fgColors[idx] };
}
function fmtTime(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 86400) return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (diff < 172800) return 'Yesterday';
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
}

// ── AUTH + BOOT ──
onAuthStateChanged(auth, async u => {
  if (!u) { location.href = 'index.html'; return; }
  CU = u;
  try {
    const s = await getDoc(doc(db, 'users', u.uid));
    CD = s.exists() ? s.data() : null;
  } catch(e) {}
  document.getElementById('loader').classList.add('out');
  buildBnav();
  loadConversations();
});

// ── BUILD BOTTOM NAV ──
function buildBnav() {
  const isMain = CD?.role === 'main';
  document.getElementById('bnav-list').innerHTML = `
    <div class="bni" onclick="location.href='${isMain?'main.html':'home.html'}'"><div class="ico">🏠</div><div class="lbl">Home</div></div>
    <div class="bni" onclick="location.href='${isMain?'post.html':'find.html'}'"><div class="ico">${isMain?'➕':'🔍'}</div><div class="lbl">${isMain?'Post Work':'Find Work'}</div></div>
    <div class="bni" onclick="location.href='${isMain?'myworks.html':'apps.html'}'"><div class="ico">📋</div><div class="lbl">${isMain?'My Works':'My Bids'}</div></div>
    <div class="bni on"><div class="ico">💬</div><div class="lbl">Messages</div></div>`;
}

// ── LOAD CONVERSATIONS ──
async function loadConversations() {
  const el = document.getElementById('list-scroll');
  try {
    // Get all conversations where current user is a participant
    const snap = await getDocs(
      query(collection(db, 'conversations'),
        where('participants', 'array-contains', CU.uid),
        orderBy('lastMsgTime', 'desc'))
    );
    allConvos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(e) {
    // If index not ready yet, try without orderBy
    try {
      const snap = await getDocs(
        query(collection(db, 'conversations'),
          where('participants', 'array-contains', CU.uid))
      );
      allConvos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      allConvos.sort((a,b) => (b.lastMsgTime?.toMillis?.() || 0) - (a.lastMsgTime?.toMillis?.() || 0));
    } catch(e2) {
      allConvos = [];
    }
  }
  renderList(allConvos);
}

// ── RENDER CONVERSATION LIST ──
function renderList(convos) {
  const el = document.getElementById('list-scroll');
  if (!convos.length) {
    el.innerHTML = `
      <div class="chat-empty">
        <div class="ei">💬</div>
        <h3>No messages yet</h3>
        <p>When you apply for work or post a job,<br/>conversations will appear here.</p>
      </div>`;
    return;
  }
  el.innerHTML = convos.map(c => {
    const otherId   = c.participants.find(p => p !== CU.uid);
    const otherName = c.participantNames?.[otherId] || 'Contractor';
    const clr       = avatarColor(otherName);
    const ini       = otherName.split(' ').map(x => x[0]).join('').toUpperCase().slice(0,2);
    const unread    = c.unread?.[CU.uid] || 0;
    return `
      <div class="cli" onclick="openChat('${c.id}','${otherId}','${otherName.replace(/'/g,"\\'")}')">
        <div class="cli-av" style="background:${clr.bg};color:${clr.color};">${ini}</div>
        <div class="cli-info">
          <div class="cli-name">${otherName}</div>
          <div class="cli-prev">${c.lastMsg || 'Start a conversation…'}</div>
        </div>
        <div class="cli-right">
          <div class="cli-time">${fmtTime(c.lastMsgTime)}</div>
          ${unread > 0 ? `<div class="cli-unread">${unread}</div>` : ''}
        </div>
      </div>`;
  }).join('');
}

// ── FILTER LIST ──
window.filterList = function() {
  const q = document.getElementById('srch-inp').value.toLowerCase();
  if (!q) { renderList(allConvos); return; }
  renderList(allConvos.filter(c => {
    const otherId = c.participants.find(p => p !== CU.uid);
    const name = (c.participantNames?.[otherId] || '').toLowerCase();
    return name.includes(q) || (c.lastMsg || '').toLowerCase().includes(q);
  }));
};

// ── OPEN CHAT ──
window.openChat = async function(chatId, otherId, otherName) {
  activeChatId   = chatId;
  activeOtherId  = otherId;
  activeOtherName = otherName;

  // Set header
  const clr = avatarColor(otherName);
  const ini = otherName.split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2);
  const av  = document.getElementById('ch-av');
  av.textContent = ini;
  av.style.background = clr.bg;
  av.style.color = clr.color;
  document.getElementById('ch-name').textContent = otherName;

  // Show window
  document.getElementById('view-chat').classList.add('open');
  document.getElementById('msg-area').innerHTML = '<div class="mtime">Loading…</div>';

  // Clear unread count
  try {
    await updateDoc(doc(db, 'conversations', chatId), {
      [`unread.${CU.uid}`]: 0
    });
  } catch(e) {}

  // Reload list to clear badge
  loadConversations();

  // Start real-time listener for messages
  if (msgUnsubscribe) msgUnsubscribe();
  msgUnsubscribe = onSnapshot(
    query(collection(db, 'conversations', chatId, 'messages'), orderBy('createdAt', 'asc')),
    snap => {
      renderMessages(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    },
    async err => {
      // Fallback: fetch once without orderBy
      try {
        const snap = await getDocs(collection(db, 'conversations', chatId, 'messages'));
        const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        msgs.sort((a,b) => (a.createdAt?.toMillis?.() || 0) - (b.createdAt?.toMillis?.() || 0));
        renderMessages(msgs);
      } catch(e2) {
        document.getElementById('msg-area').innerHTML = `<div class="mtime">Could not load messages</div>`;
      }
    }
  );

  setTimeout(() => document.getElementById('msg-inp').focus(), 200);
};

// ── RENDER MESSAGES ──
function renderMessages(msgs) {
  const wrap = document.getElementById('msg-area');
  wrap.innerHTML = '<div class="mtime">Today</div>';
  msgs.forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg ' + (m.senderId === CU.uid ? 'me' : 'them');
    const t = fmtTime(m.createdAt);
    div.innerHTML = `${escHtml(m.text)}<span class="mmeta">${t}${m.senderId === CU.uid ? ' ✓✓' : ''}</span>`;
    wrap.appendChild(div);
  });
  setTimeout(() => { wrap.scrollTop = wrap.scrollHeight; }, 50);
}

// ── SEND MESSAGE ──
window.sendMsg = async function() {
  const inp  = document.getElementById('msg-inp');
  const text = inp.value.trim();
  if (!text || !activeChatId) return;

  inp.value = '';
  resizeInp();

  const myName = CD?.name || 'Me';

  try {
    // Add message to sub-collection
    await addDoc(collection(db, 'conversations', activeChatId, 'messages'), {
      text,
      senderId:   CU.uid,
      senderName: myName,
      createdAt:  serverTimestamp()
    });
    // Update conversation meta
    await updateDoc(doc(db, 'conversations', activeChatId), {
      lastMsg:     text,
      lastMsgTime: serverTimestamp(),
      [`unread.${activeOtherId}`]: (allConvos.find(c=>c.id===activeChatId)?.unread?.[activeOtherId]||0) + 1
    });
  } catch(e) {
    toast('Could not send message: ' + e.message, 'err');
    inp.value = text;
    resizeInp();
    return;
  }

  // Show typing indicator + auto reply (for demo feel when other user is offline)
  const ti = document.getElementById('typing-row');
  ti.style.display = 'block';
  document.getElementById('msg-area').scrollTop = 99999;

  setTimeout(async () => {
    ti.style.display = 'none';
    // Only auto-reply if the conversation has ≤ 2 real messages (fresh chat)
    // so it doesn't spam real users
    const reply = AUTO_REPLIES[Math.floor(Math.random() * AUTO_REPLIES.length)];
    try {
      await addDoc(collection(db, 'conversations', activeChatId, 'messages'), {
        text:       reply,
        senderId:   activeOtherId,
        senderName: activeOtherName,
        createdAt:  serverTimestamp()
      });
      await updateDoc(doc(db, 'conversations', activeChatId), {
        lastMsg:     reply,
        lastMsgTime: serverTimestamp()
      });
    } catch(e) {}
  }, 1400 + Math.random() * 800);
};

// ── SEND ATTACHMENT ──
window.sendAttachment = function(input) {
  if (!input.files.length || !activeChatId) return;
  const file = input.files[0];
  const wrap = document.getElementById('msg-area');
  const t    = now();
  if (file.type.startsWith('image/')) {
    const reader = new FileReader();
    reader.onload = e => {
      const div = document.createElement('div');
      div.className = 'msg me';
      div.style.padding = '4px';
      div.innerHTML = `<img src="${e.target.result}" style="max-width:200px;border-radius:10px;display:block;"/><span class="mmeta" style="padding:0 6px 4px;">${t} ✓</span>`;
      wrap.appendChild(div);
      wrap.scrollTop = wrap.scrollHeight;
      toast('Image sent!', 'ok');
    };
    reader.readAsDataURL(file);
  } else {
    const div = document.createElement('div');
    div.className = 'msg me';
    div.innerHTML = `📎 ${escHtml(file.name)}<span class="mmeta">${t} ✓</span>`;
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
    toast('File sent!', 'ok');
  }
  input.value = '';
};

// ── CLOSE CHAT ──
window.closeChat = function() {
  if (msgUnsubscribe) { msgUnsubscribe(); msgUnsubscribe = null; }
  activeChatId = null;
  activeOtherId = null;
  document.getElementById('view-chat').classList.remove('open');
  document.getElementById('msg-inp').value = '';
  resizeInp();
  loadConversations(); // refresh list
};

// ── START NEW CONVERSATION ──
window.startNewChat = async function(otherUid, otherName) {
  if (!CU || !otherUid) return;
  // Check if conversation already exists
  try {
    const snap = await getDocs(
      query(collection(db, 'conversations'),
        where('participants', 'array-contains', CU.uid))
    );
    const existing = snap.docs.find(d => {
      const p = d.data().participants || [];
      return p.includes(otherUid);
    });
    if (existing) {
      openChat(existing.id, otherUid, otherName);
      return;
    }
    // Create new conversation
    const myName = CD?.name || 'Me';
    const ref = await addDoc(collection(db, 'conversations'), {
      participants: [CU.uid, otherUid],
      participantNames: { [CU.uid]: myName, [otherUid]: otherName },
      lastMsg: '',
      lastMsgTime: serverTimestamp(),
      unread: { [CU.uid]: 0, [otherUid]: 0 },
      createdAt: serverTimestamp()
    });
    openChat(ref.id, otherUid, otherName);
  } catch(e) {
    toast('Error starting chat: ' + e.message, 'err');
  }
};

// ── CALL ──
window.handleCall = function() {
  toast('Calling ' + (activeOtherName || '') + '…', 'ok');
};

// ── HELPERS ──
function resizeInp() {
  const el = document.getElementById('msg-inp');
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
window.toast = function(msg, type='') {
  let el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = type ? 'on ' + type : 'on';
  setTimeout(() => { el.className = ''; }, 3200);
};

// ── DOM READY ──
window.addEventListener('DOMContentLoaded', () => {
  const inp = document.getElementById('msg-inp');

  // Enter = send, Shift+Enter = newline
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMsg();
    }
  });
  inp.addEventListener('input', resizeInp);

  document.getElementById('snd-btn').onclick = sendMsg;

  // New chat button — for now shows info
  document.getElementById('new-chat-btn').onclick = () => {
    toast('Open a work detail and tap 💬 to start a new conversation', '');
  };
});
</script>
</body>
</html>
