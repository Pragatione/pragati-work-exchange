<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<meta name="theme-color" content="#1D4ED8"/>
<title>Work Details — Pragati Work Exchange</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="loader">
  <div class="ld-icon"><img src="https://lh3.googleusercontent.com/d/16oZcVd80uLrux2B-jN84sTUlmOqGoPQd" alt="Pragati" onerror="this.style.display='none'"/></div>
  <div class="ld-brand">Pragati<span>.</span></div>
  <div class="ld-sub">Work Exchange · PragatiOne</div>
  <div class="ld-bar"><div class="ld-fill"></div></div>
</div>
<div id="toast"></div>

<div style="display:flex;flex-direction:column;min-height:100vh;">
  <div class="dh" id="det-hero">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <button class="tbk" onclick="history.back()" style="background:rgba(255,255,255,.2);color:#fff;">←</button>
      <div style="flex:1;"></div>
      <button class="tbk" id="save-btn" style="background:rgba(255,255,255,.2);" onclick="toggleSave()">🔖</button>
      <button class="tbk" id="share-btn" style="background:rgba(255,255,255,.2);" onclick="shareWork()">↗</button>
    </div>
    <div class="tags" id="det-tags"></div>
    <h1 id="det-title" style="margin-top:6px;">Loading…</h1>
    <div id="det-co" style="font-size:12px;opacity:.8;margin-top:4px;"></div>
    <div class="dprog" style="margin-top:12px;"><div class="dpf" id="det-pf" style="width:30%;"></div></div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;opacity:.7;">
      <span id="det-bt"></span><span id="det-dl"></span>
    </div>
  </div>

  <div class="pscr" style="padding-bottom:0;" id="det-body">
    <div class="dsec"><h4>Work Details</h4>
      <div class="irow"><span class="ik">Budget</span><span class="iv" style="color:var(--green2);" id="det-bud">—</span></div>
      <div class="irow"><span class="ik">Location</span><span class="iv" id="det-loc">—</span></div>
      <div class="irow"><span class="ik">Duration</span><span class="iv" id="det-dur">—</span></div>
      <div class="irow"><span class="ik">Start Date</span><span class="iv" id="det-std">—</span></div>
      <div class="irow"><span class="ik">Experience</span><span class="iv" id="det-exp">—</span></div>
      <div class="irow"><span class="ik">Labour</span><span class="iv" id="det-lab">—</span></div>
    </div>
    <div class="dsec"><h4>Scope of Work</h4><div id="det-scope"></div></div>
    <!-- Already applied box (petty contractor) -->
    <div class="dsec" id="det-abox" style="display:none;text-align:center;padding:16px;">
      <div style="font-size:32px;margin-bottom:8px;">✅</div>
      <div style="font-family:var(--h);font-size:15px;font-weight:700;color:var(--green2);">Already Applied!</div>
      <div style="font-size:12px;color:var(--s4);margin-top:4px;">You will be notified when status changes.</div>
      <div id="det-app-status" style="margin-top:10px;"></div>
    </div>
    <!-- Main contractor: bids summary box -->
    <div class="dsec" id="det-mbox" style="display:none;text-align:center;padding:16px;">
      <div style="font-size:32px;margin-bottom:8px;">📋</div>
      <div style="font-family:var(--h);font-size:15px;font-weight:700;color:var(--blue2);" id="det-bid-count">0 bids received</div>
      <div style="font-size:12px;color:var(--s4);margin-top:4px;">This is your own work posting.</div>
    </div>
    <div style="height:100px;"></div>
  </div>

  <!-- CTA: role-aware -->
  <div class="scta" id="det-cta">
    <button class="btn btn-g" style="width:46px;font-size:20px;padding:0;" id="chat-btn" onclick="startChatPoster()">💬</button>
    <button class="btn btn-p" style="flex:1;" id="apply-btn" onclick="goApply()">Submit Quotation →</button>
  </div>
  <!-- Main contractor CTA -->
  <div class="scta" id="det-main-cta" style="display:none;">
    <button class="btn btn-g" style="flex:1;" onclick="location.href='myworks.html'">← My Works</button>
    <button class="btn btn-o" style="flex:2;" id="view-bids-btn" onclick="goViewBids()">View All Bids →</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
<script>
var firebase_cfg={apiKey:"AIzaSyBT465A_V0oe-8wkeWk8hee7NXUBSLZcyA",authDomain:"pragati-work-exchange.firebaseapp.com",projectId:"pragati-work-exchange",storageBucket:"pragati-work-exchange.firebasestorage.app",messagingSenderId:"422215240765",appId:"1:422215240765:web:eefb239420262c9d822e54"};
if(!firebase.apps.length) firebase.initializeApp(firebase_cfg);
var auth=firebase.auth(), db=firebase.firestore(), FS=firebase.firestore;
var CU=null,CD=null,CW=null;
var SL={pending:'Under Review',review:'Shortlisted ✓',shortlisted:'Shortlisted ✓',awarded:'Awarded 🎉',rejected:'Not Selected'};
var SM={pending:'pend',review:'rev',shortlisted:'rev',awarded:'awd',rejected:'rej'};

auth.onAuthStateChanged(async function(user){
  if(!user){location.href='index.html';return;}
  CU=user;
  try{var s=await db.collection('users').doc(user.uid).get();CD=s.exists?s.data():null;}catch(e){}
  if(!CD){location.href='index.html';return;}
  document.getElementById('loader').classList.add('out');
  loadDetail();
});

function getP(k){return new URLSearchParams(window.location.search).get(k);}

async function loadDetail(){
  var id=getP('id');
  if(!id){history.back();return;}
  try{var s=await db.collection('works').doc(id).get();CW=s.exists?Object.assign({id:s.id},s.data()):null;}catch(e){}
  if(!CW) CW=DEMO_WORKS.find(function(w){return w.id===id;});
  if(!CW){history.back();return;}
  saveLS('currentWork',CW);

  // Header
  document.getElementById('det-tags').innerHTML=
    '<span class="tag" style="background:rgba(255,255,255,.2);color:#fff;">'+esc(CW.trade||'')+'</span>'+
    (CW.urgency&&CW.urgency!=='Normal'?'<span class="tag t-or">'+esc(CW.urgency.toUpperCase())+'</span>':'');
  document.getElementById('det-title').textContent=CW.title||'—';
  document.getElementById('det-co').textContent='🏢 '+(CW.company||CW.postedByName||'')+' · 📍 '+(CW.location||'');
  document.getElementById('det-bud').textContent=fmtBud(CW);
  document.getElementById('det-loc').textContent=CW.location||'—';
  document.getElementById('det-dur').textContent=CW.duration?(CW.duration+' Days'):'—';
  document.getElementById('det-std').textContent=CW.startDate||'—';
  document.getElementById('det-exp').textContent=CW.experience||'—';
  document.getElementById('det-lab').textContent=CW.labour||'—';
  document.getElementById('det-bt').textContent=(CW.bids||0)+' bids received';
  document.getElementById('det-dl').textContent=CW.startDate?'Start: '+CW.startDate:'';
  document.getElementById('det-pf').style.width=Math.min(100,((CW.bids||0)/12)*100)+'%';

  // Scope
  var scope=CW.scope||'';
  document.getElementById('det-scope').innerHTML=scope?
    scope.split('\n').filter(function(s){return s.trim();}).map(function(s){return '<div class="blit"><div class="bdo"></div>'+esc(s.trim())+'</div>';}).join(''):
    '<p style="color:var(--s4);font-size:13px;">No scope details provided.</p>';

  var isMainUser=CD.role==='main';
  var isOwner=CW.postedBy&&CW.postedBy===CU.uid;

  if(isMainUser){
    // Main contractor view
    document.getElementById('det-cta').style.display='none';
    document.getElementById('det-main-cta').style.display='flex';
    if(isOwner){
      document.getElementById('det-mbox').style.display='block';
      document.getElementById('det-bid-count').textContent=(CW.bids||0)+' bids received';
      document.getElementById('chat-btn').style.display='none';
    } else {
      // Viewing someone else's work as main contractor - show contact button
      document.getElementById('det-main-cta').innerHTML='<button class="btn btn-g" style="flex:1;" onclick="history.back()">← Back</button><button class="btn btn-o" style="flex:2;" onclick="startChatPoster()">💬 Contact Poster</button>';
    }
  } else {
    // Petty contractor view
    // Check saved bookmark
    var saved=getLS('savedWorks')||[];
    if(saved.includes(CW.id)) document.getElementById('save-btn').textContent='🔖✓';

    try{
      var snap=await db.collection('applications').where('workId','==',id).where('applicantId','==',CU.uid).get();
      if(!snap.empty){
        document.getElementById('det-abox').style.display='block';
        document.getElementById('det-cta').style.display='none';
        var appData=snap.docs[0].data();
        var st=appData.status||'pending';
        document.getElementById('det-app-status').innerHTML=
          '<span class="sts '+(SM[st]||'pend')+'">'+( SL[st]||'Under Review')+'</span>'+
          '<div style="font-size:11px;color:var(--s4);margin-top:6px;">Quoted ₹'+Number(appData.amount||0).toLocaleString('en-IN')+' · '+(appData.days||'—')+' days</div>';
      }
    }catch(e){}
  }
}

function goApply(){
  if(CW) saveLS('currentWork',CW);
  location.href='quote.html?id='+(CW?CW.id:'');
}

function goViewBids(){
  if(CW) location.href='bids.html?id='+CW.id;
}

function toggleSave(){
  var b=document.getElementById('save-btn');
  var saved=getLS('savedWorks')||[];
  if(CW&&!saved.includes(CW.id)){saved.push(CW.id);b.textContent='🔖✓';toast('Saved!','ok');}
  else if(CW){saved=saved.filter(function(s){return s!==CW.id;});b.textContent='🔖';toast('Removed from saved','ok');}
  saveLS('savedWorks',saved);
}

function shareWork(){
  if(navigator.share){navigator.share({title:(CW?CW.title:'')+' – Pragati',text:'Check out this work on Pragati Work Exchange',url:window.location.href});}
  else{navigator.clipboard.writeText(window.location.href).then(function(){toast('Link copied!','ok');});}
}

async function startChatPoster(){
  if(!CW||!CU){toast('Please login first','err');return;}
  var otherId=CW.postedBy, otherName=CW.company||CW.postedByName||'Main Contractor';
  if(!otherId||otherId===CU.uid){toast('Cannot chat with yourself','err');return;}
  try{
    var snap=await db.collection('conversations').where('participants','array-contains',CU.uid).get();
    var existing=snap.docs.find(function(d){return (d.data().participants||[]).includes(otherId);});
    if(!existing){
      await db.collection('conversations').add({
        participants:[CU.uid,otherId],
        participantNames:{[CU.uid]:CD.name||'Contractor',[otherId]:otherName},
        workId:CW.id,workTitle:CW.title,
        lastMsg:'',lastMsgTime:FS.FieldValue.serverTimestamp(),
        unread:{[CU.uid]:0,[otherId]:0},createdAt:FS.FieldValue.serverTimestamp()
      });
    }
    saveLS('chatTarget',{uid:otherId,name:otherName,workId:CW.id,workTitle:CW.title});
    location.href='chat.html';
  }catch(e){toast('Error: '+e.message,'err');}
}
</script>
</body>
</html>
