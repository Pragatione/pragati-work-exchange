  storageBucket:"pragati-work-exchange.firebasestorage.app",

if(!firebase.apps.length) firebase.initializeApp(firebase_cfg);
const auth = firebase.auth();
const db   = firebase.firestore();
const FS   = firebase.firestore;
var CU=null, CD=null;
auth.onAuthStateChanged(async function(user){
  if(!user){location.href='index.html';return;}
  CU=user;
  try{var s=await db.collection('users').doc(user.uid).get(); CD=s.exists?s.data():null;}catch(e){}
  if(!CD){location.href='index.html';return;}
  if(cd && cd.role==='main'){location.href='main.html';return;}

function toast(msg,type){
  var el=document.getElementById('toast'); el.textContent=msg;
  el.className=type?'on '+type:'on'; setTimeout(function(){el.className='';},3000);
}
function getP(k){return new URLSearchParams(window.location.search).get(k);}
function saveLS(k,v){try{localStorage.setItem('pg_'+k,JSON.stringify(v));}catch(e){}}
function getLS(k){try{return JSON.parse(localStorage.getItem('pg_'+k));}catch(e){return null;}}
function clearLS(k){localStorage.removeItem('pg_'+k);}
function fmtBud(w){
  var f=function(n){return n>=100000?'₹'+(n/100000).toFixed(1).replace('.0','')+'L':'₹'+n.toLocaleString('en-IN');};
  return(w.minBudget&&w.maxBudget)?f(w.minBudget)+'–'+f(w.maxBudget):w.minBudget?f(w.minBudget):'TBD';
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function initials(n){return(n||'U').split(' ').map(function(x){return x[0];}).join('').toUpperCase().slice(0,2);}
function tagClr(u){return u==='Urgent'?'t-or':u==='Critical'?'t-re':'t-gr';}
function emptyHTML(ico,t,s){return '<div class="empty"><div class="ei">'+ico+'</div><h3>'+t+'</h3><p>'+s+'</p></div>';}
function mkCard(w){
  return '<div class="wcard" onclick="location.href='detail.html?id='+w.id+''">'+
    '<div class="wh"><div class="tags"><span class="tag t-bl">'+esc(w.trade||'General')+'</span>'+
    '<span class="tag '+tagClr(w.urgency)+'">'+esc(w.urgency||'Normal')+'</span></div>'+
    '<div class="wt">'+esc(w.title)+'</div>'+
    '<div class="wco">🏢 '+esc(w.company||w.postedByName||'Main Contractor')+'</div></div>'+
    '<div class="wb"><div class="wmeta"><span>📍 '+esc(w.location||'—')+'</span>'+
    '<span>⏱ '+esc(w.startDate||'TBD')+'</span>'+
    '<span>👷 '+esc(w.experience||'—')+'</span></div></div>'+
    '<div class="wf"><span class="wbud">'+fmtBud(w)+'</span>'+
    '<span class="wbids">'+(w.bids||0)+' bids</span></div></div>';
}
</script>
<script>
var allApps=[],filterF='all';
var SL={pending:'Under Review',review:'Shortlisted ✓',shortlisted:'Shortlisted ✓',awarded:'Awarded 🎉',rejected:'Not Selected'};
var SM={pending:'pend',review:'rev',shortlisted:'rev',awarded:'awd',rejected:'rej'};
async function loadApps(){
  try{
    var snap=await db.collection('applications').where('applicantId','==',CU.uid).get();
    allApps=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    allApps.sort(function(a,b){return (b.createdAt&&b.createdAt.toMillis?b.createdAt.toMillis():0)-(a.createdAt&&a.createdAt.toMillis?a.createdAt.toMillis():0);});
  }catch(e){allApps=[];}
  renderApps();
}
function renderApps(){
  var el=document.getElementById('apps-list');
  var arr=filterF==='all'?allApps:allApps.filter(function(a){
    if(filterF==='rev') return a.status==='review'||a.status==='shortlisted';
    return a.status===filterF;
  });
  if(!arr.length){
    el.innerHTML=emptyHTML('📋','No applications yet','Browse works and submit your first quotation!')+
      '<div style="padding:10px 0;"><button class="btn btn-p btn-bl" onclick="location.href='find.html'">Browse Works →</button></div>';
    return;
  }
  el.innerHTML=arr.map(function(a){
    return '<div class="arow">'+
      '<div class="art">'+esc(a.workTitle||'Work')+'</div>'+
      '<div class="ars">'+esc(a.workCompany||'—')+' · '+esc(a.workLocation||'—')+'</div>'+
      '<div style="font-size:12px;color:var(--s4);margin-bottom:9px;">Quoted ₹'+Number(a.amount||0).toLocaleString('en-IN')+' · '+(a.days||'—')+' days</div>'+
      '<div class="arf"><span class="sts '+(SM[a.status||'pending']||'pend')+'">'+(SL[a.status||'pending']||'Under Review')+'</span>'+
      '<div style="display:flex;gap:6px;">'+
      (a.status==='awarded'?'<button class="btn btn-sm" style="background:var(--green4);color:var(--green);border:none;" onclick="toast('Rating coming soon!','')">Rate ⭐</button>':'')+
      '<button class="btn btn-g btn-sm" onclick="location.href='chat.html'">💬</button>'+
      '</div></div></div>';
  }).join('');
}
function setF(el,f){document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on');});el.classList.add('on');filterF=f;renderApps();}
</script>
