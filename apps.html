<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<meta name="theme-color" content="#1D4ED8"/>
<title>My Applications — Pragati Work Exchange</title>
<link rel="stylesheet" href="style.css"/>
<style>
.bni{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:6px 4px;flex:1;border:none;background:none;position:relative;}
.bni .ico{width:26px;height:26px;display:flex;align-items:center;justify-content:center;transition:transform .18s;}
.bni .ico svg{stroke:var(--s5);transition:stroke .18s;}
.bni .lbl{font-size:10px;font-weight:600;color:var(--s5);transition:color .18s;letter-spacing:.01em;}
.bni.on .ico svg{stroke:var(--blue2);transform:scale(1.15);}
.bni.on .lbl{color:var(--blue2);}
.bni:active .ico{transform:scale(.9);}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--s7);display:flex;z-index:50;padding:8px 0 max(env(safe-area-inset-bottom),12px);box-shadow:0 -2px 16px rgba(0,0,0,.07);}
/* Hire request card */
.hreq-card{background:linear-gradient(135deg,#FFF7ED,#fff);border:1px solid #FED7AA;border-radius:14px;padding:14px;margin-bottom:10px;position:relative;overflow:hidden;}
.hreq-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--orange2),var(--orange3));}
.hreq-badge{display:inline-flex;align-items:center;gap:5px;background:var(--orange4);color:var(--orange);font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;margin-bottom:8px;letter-spacing:.04em;}
/* Star rating */
.star-row{display:flex;gap:6px;justify-content:center;margin:12px 0;}
.star-btn{font-size:28px;cursor:pointer;transition:transform .15s;color:#E2E8F0;}
.star-btn.active{color:#F59E0B;}
.star-btn:hover{transform:scale(1.15);}
/* Tabs */
.tab-row{display:flex;border-bottom:1.5px solid var(--s7);margin-bottom:0;flex-shrink:0;background:#fff;}
.tab-btn{flex:1;padding:10px 4px;font-size:12px;font-weight:700;color:var(--s4);border:none;background:none;border-bottom:2px solid transparent;cursor:pointer;transition:.18s;letter-spacing:.02em;}
.tab-btn.on{color:var(--blue2);border-bottom-color:var(--blue2);}
</style>
</head>
<body>
<div id="loader">
  <div class="ld-icon"><img src="https://lh3.googleusercontent.com/d/16oZcVd80uLrux2B-jN84sTUlmOqGoPQd" alt="Pragati" onerror="this.style.display='none'"/></div>
  <div class="ld-brand">Pragati<span>.</span></div>
  <div class="ld-sub">Work Exchange · PragatiOne</div>
  <div class="ld-bar"><div class="ld-fill"></div></div>
</div>
<div id="toast"></div>

<div style="display:flex;flex-direction:column;min-height:100vh;">
  <div class="tbar"><h2>My Work</h2><button class="btn btn-p btn-sm" onclick="location.href='find.html'">Find Work</button></div>

  <!-- Top Tabs: Bids / Hire Requests -->
  <div class="tab-row" id="top-tabs">
    <button class="tab-btn on" onclick="switchTab('bids',this)">📋 My Bids</button>
    <button class="tab-btn" onclick="switchTab('hire',this)">🤝 Hire Requests <span id="hire-cnt-badge" style="display:none;background:var(--orange2);color:#fff;font-size:9px;font-weight:800;padding:1px 6px;border-radius:10px;margin-left:4px;"></span></button>
  </div>

  <!-- BIDS PANEL -->
  <div id="panel-bids" style="display:flex;flex-direction:column;flex:1;">
    <div class="chips" style="padding:10px 16px 0;flex-shrink:0;">
      <div class="chip on" onclick="setF(this,'all')">All</div>
      <div class="chip" onclick="setF(this,'pending')">Pending</div>
      <div class="chip" onclick="setF(this,'rev')">Shortlisted</div>
      <div class="chip" onclick="setF(this,'awarded')">Awarded</div>
      <div class="chip" onclick="setF(this,'rejected')">Rejected</div>
    </div>
    <div class="pscr pb90" style="padding:10px 16px 0;" id="apps-list">
      <div class="empty"><div class="spin" style="margin:0 auto;"></div></div>
    </div>
  </div>

  <!-- HIRE REQUESTS PANEL -->
  <div id="panel-hire" style="display:none;flex:1;">
    <div class="pscr pb90" style="padding:12px 16px 0;" id="hire-list">
      <div class="empty"><div class="spin" style="margin:0 auto;"></div></div>
    </div>
  </div>

  <nav class="bnav">
    <div class="bni" onclick="location.href='home.html'"><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div><div class="lbl">Home</div></div>
    <div class="bni" onclick="location.href='find.html'"><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></div><div class="lbl">Find Work</div></div>
    <div class="bni on" onclick="location.href='apps.html'"><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg></div><div class="lbl">My Bids</div></div>
    <div class="bni" onclick="location.href='chat.html'"><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 10h.01"/><path d="M12 10h.01"/><path d="M16 10h.01"/></svg></div><div class="lbl">Messages</div></div>
  </nav>
</div>

<!-- RATE WORK SHEET -->
<div class="ovl off" id="rate-ovl">
  <div class="sheet">
    <div class="shdl"></div>
    <div class="shtit">Rate This Work ⭐</div>
    <p style="font-size:13px;color:var(--s3);line-height:1.6;margin-bottom:4px;" id="rate-wt-label">—</p>
    <div class="star-row" id="star-row">
      <span class="star-btn" data-v="1" onclick="setStar(1)">★</span>
      <span class="star-btn" data-v="2" onclick="setStar(2)">★</span>
      <span class="star-btn" data-v="3" onclick="setStar(3)">★</span>
      <span class="star-btn" data-v="4" onclick="setStar(4)">★</span>
      <span class="star-btn" data-v="5" onclick="setStar(5)">★</span>
    </div>
    <div style="text-align:center;font-size:13px;color:var(--s4);margin-bottom:14px;" id="star-label">Tap to rate</div>
    <div class="field"><label class="flbl">Your Review</label>
      <textarea class="fin" id="rate-review" rows="3" placeholder="How was the work experience? Quality, punctuality…"></textarea>
    </div>
    <button class="btn btn-p btn-bl btn-lg" onclick="submitRating()">Submit Rating →</button>
    <button class="btn btn-g btn-bl" style="margin-top:10px;" onclick="document.getElementById('rate-ovl').classList.add('off')">Cancel</button>
  </div>
</div>

<!-- ACCEPT/DECLINE HIRE SHEET -->
<div class="ovl off" id="hire-detail-ovl">
  <div class="sheet">
    <div class="shdl"></div>
    <div class="shtit">Hire Request 🤝</div>
    <div id="hire-detail-content"></div>
    <div style="display:flex;gap:10px;margin-top:6px;">
      <button class="btn btn-g btn-bl" style="flex:1;" onclick="declineHire()">Decline</button>
      <button class="btn btn-o btn-bl" style="flex:2;" onclick="acceptHire()">Accept Request →</button>
    </div>
    <button class="btn btn-g btn-bl" style="margin-top:10px;" onclick="document.getElementById('hire-detail-ovl').classList.add('off')">Close</button>
  </div>
</div>

<!-- WITHDRAW BID CONFIRM -->
<div class="ovl off" id="withdraw-ovl">
  <div class="sheet">
    <div class="shdl"></div>
    <div class="shtit">Withdraw Bid?</div>
    <p style="font-size:14px;color:var(--s3);margin-bottom:20px;line-height:1.6;">Are you sure you want to withdraw your bid? This cannot be undone.</p>
    <button class="btn btn-bl" style="background:var(--red2);color:#fff;width:100%;margin-bottom:10px;" onclick="confirmWithdraw()">Yes, Withdraw</button>
    <button class="btn btn-g btn-bl" onclick="document.getElementById('withdraw-ovl').classList.add('off')">Cancel</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
<script>
var firebase_cfg={apiKey:"AIzaSyBT465A_V0oe-8wkeWk8hee7NXUBSLZcyA",authDomain:"pragati-work-exchange.firebaseapp.com",projectId:"pragati-work-exchange",storageBucket:"pragati-work-exchange.firebasestorage.app",messagingSenderId:"422215240765",appId:"1:422215240765:web:eefb239420262c9d822e54"};
if(!firebase.apps.length) firebase.initializeApp(firebase_cfg);
var auth=firebase.auth(), db=firebase.firestore(), FS=firebase.firestore;
var CU=null,CD=null;

auth.onAuthStateChanged(async function(user){
  if(!user){location.href='index.html';return;}
  CU=user;
  try{var s=await db.collection('users').doc(user.uid).get();CD=s.exists?s.data():null;}catch(e){}
  if(!CD){location.href='index.html';return;}
  if(CD.role==='main'){location.href='main.html';return;}
  document.getElementById('loader').classList.add('out');
  loadApps();
  loadHireRequests();
});

// ── STATE ──
var allApps=[],filterF='all';
var pendingRateApp=null, pendingWithdrawId=null, pendingHireId=null, selectedStar=0;
var SL={pending:'Under Review',review:'Shortlisted ✓',shortlisted:'Shortlisted ✓',awarded:'Awarded 🎉',rejected:'Not Selected'};
var SM={pending:'pend',review:'rev',shortlisted:'rev',awarded:'awd',rejected:'rej'};

// ── LOAD BIDS ──
async function loadApps(){
  try{
    var snap=await db.collection('applications').where('applicantId','==',CU.uid).get();
    allApps=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    allApps.sort(function(a,b){return (b.createdAt&&b.createdAt.toMillis?b.createdAt.toMillis():0)-(a.createdAt&&a.createdAt.toMillis?a.createdAt.toMillis():0);});
  }catch(e){allApps=[];}
  renderApps();
}

function renderApps(){
  var el=document.getElementById('apps-list');
  var arr=filterF==='all'?allApps:allApps.filter(function(a){
    if(filterF==='rev') return a.status==='review'||a.status==='shortlisted';
    return a.status===filterF;
  });
  if(!arr.length){
    el.innerHTML=emptyHTML('📋','No applications yet','Browse works and submit your first quotation!')+
      '<div style="padding:10px 0;"><button class="btn btn-p btn-bl" onclick="location.href=\'find.html\'">Browse Works →</button></div>';
    return;
  }
  el.innerHTML=arr.map(function(a){
    var st=a.status||'pending';
    var isAwarded=st==='awarded';
    var canWithdraw=st==='pending';
    return '<div class="arow">' +
      '<div class="art">'+esc(a.workTitle||'Work')+'</div>' +
      '<div class="ars">'+esc(a.workCompany||'—')+' · '+esc(a.workLocation||'—')+'</div>' +
      '<div style="font-size:12px;color:var(--s4);margin-bottom:9px;">Quoted ₹'+Number(a.amount||0).toLocaleString('en-IN')+' · '+(a.days||'—')+' days</div>'+
      '<div class="arf">' +
        '<span class="sts '+(SM[st]||'pend')+'">'+(SL[st]||'Under Review')+'</span>'+
        '<div style="display:flex;gap:6px;">' +
          (isAwarded&&!a.rated?'<button class="btn btn-sm" style="background:var(--green4);color:var(--green);border:1px solid var(--green3);" onclick="openRateWork(\''+a.id+'\',\''+esc(a.workTitle||'Work')+'\',\''+esc(a.postedBy||'')+'\')">Rate ⭐</button>':'') +
          (isAwarded&&a.rated?'<span style="font-size:11px;color:var(--green2);font-weight:700;">Rated ⭐'+a.rating+'</span>':'') +
          '<button class="btn btn-g btn-sm" onclick="goChatWork(\''+esc(a.workId||'')+'\',\''+esc(a.workCompany||a.postedBy||'')+'\',\''+esc(a.postedBy||'')+'\')">💬</button>' +
          (canWithdraw?'<button class="btn btn-sm" style="background:var(--red5);color:var(--red2);border:1px solid #FECACA;" onclick="openWithdraw(\''+a.id+'\')">Withdraw</button>':'') +
        '</div>' +
      '</div>' +
      // Show awarded notification banner
      (isAwarded&&!a.ratedShown?'<div style="margin-top:8px;background:var(--green4);border:1px solid var(--green3);border-radius:9px;padding:9px 12px;font-size:12px;color:var(--green);font-weight:600;">🎉 Congratulations! You have been awarded this work. Chat with the main contractor to finalize start date.</div>':'') +
      '</div>';
  }).join('');
}

function setF(el,f){
  document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on');});
  el.classList.add('on'); filterF=f; renderApps();
}

// ── LOAD HIRE REQUESTS ──
async function loadHireRequests(){
  var el=document.getElementById('hire-list');
  var hires=[];
  try{
    var snap=await db.collection('hire_requests').where('toUid','==',CU.uid).orderBy('createdAt','desc').get();
    hires=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
  }catch(e){hires=[];}

  // Badge
  var pending=hires.filter(function(h){return h.status==='pending';});
  var badge=document.getElementById('hire-cnt-badge');
  if(pending.length){badge.textContent=pending.length;badge.style.display='inline';}

  if(!hires.length){
    el.innerHTML=emptyHTML('🤝','No hire requests','Main contractors can hire you directly from your profile');
    return;
  }
  el.innerHTML=hires.map(function(h){
    var st=h.status||'pending';
    var stCls=st==='accepted'?'awd':st==='declined'?'rej':'pend';
    var stTxt=st==='accepted'?'Accepted ✓':st==='declined'?'Declined':'Pending Response';
    return '<div class="hreq-card">'+
      '<div class="hreq-badge">🤝 DIRECT HIRE REQUEST</div>'+
      '<div style="font-family:var(--h);font-size:14px;font-weight:700;margin-bottom:4px;">'+esc(h.fromName||'Main Contractor')+'</div>'+
      '<div style="font-size:12px;color:var(--s3);line-height:1.6;margin-bottom:8px;">'+esc(h.description||'No description provided')+'</div>'+
      '<div style="display:flex;gap:12px;font-size:12px;color:var(--s4);margin-bottom:10px;flex-wrap:wrap;">'+
        (h.startDate?'<span>📅 '+esc(h.startDate)+'</span>':'')+
        (h.duration?'<span>⏱ '+esc(h.duration)+' days</span>':'')+
        (h.budget?'<span>💰 ₹'+Number(h.budget).toLocaleString('en-IN')+'</span>':'')+
      '</div>'+
      '<div class="arf">'+
        '<span class="sts '+stCls+'">'+stTxt+'</span>'+
        (st==='pending'?'<button class="btn btn-o btn-sm" onclick="openHireDetail(\''+h.id+'\',\''+esc(h.fromName||'Main Contractor')+'\',\''+esc(h.fromUid||'')+'\')">View & Respond →</button>':'<button class="btn btn-g btn-sm" onclick="chatHirer(\''+esc(h.fromUid||'')+'\',\''+esc(h.fromName||'Main Contractor')+'\')">💬 Chat</button>')+
      '</div>'+
    '</div>';
  }).join('');
}

// ── TAB SWITCH ──
function switchTab(tab, btn){
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  document.getElementById('panel-bids').style.display=tab==='bids'?'flex':'none';
  document.getElementById('panel-hire').style.display=tab==='hire'?'block':'none';
}

// ── RATE WORK ──
function openRateWork(appId, workTitle, postedBy){
  pendingRateApp={id:appId,postedBy:postedBy};
  selectedStar=0;
  document.getElementById('rate-wt-label').textContent='Rate your experience for: '+workTitle;
  document.querySelectorAll('.star-btn').forEach(function(b){b.classList.remove('active');});
  document.getElementById('star-label').textContent='Tap to rate';
  document.getElementById('rate-review').value='';
  document.getElementById('rate-ovl').classList.remove('off');
}

function setStar(v){
  selectedStar=v;
  var labels=['','Poor','Fair','Good','Very Good','Excellent!'];
  document.getElementById('star-label').textContent=labels[v]||'';
  document.querySelectorAll('.star-btn').forEach(function(b){
    b.classList.toggle('active',parseInt(b.dataset.v)<=v);
  });
}

async function submitRating(){
  if(!selectedStar){toast('Please select a star rating','err');return;}
  if(!pendingRateApp){return;}
  var review=document.getElementById('rate-review').value.trim();
  try{
    await db.collection('applications').doc(pendingRateApp.id).update({rated:true,rating:selectedStar,review:review,ratedAt:FS.FieldValue.serverTimestamp()});
    // Also save rating to works collection for main contractor to see
    if(pendingRateApp.postedBy){
      await db.collection('ratings').add({
        appId:pendingRateApp.id, fromUid:CU.uid, fromName:CD.name||'Contractor',
        toUid:pendingRateApp.postedBy, rating:selectedStar, review:review,
        createdAt:FS.FieldValue.serverTimestamp()
      });
    }
    toast('Rating submitted! Thank you ⭐','ok');
    document.getElementById('rate-ovl').classList.add('off');
    loadApps();
  }catch(e){toast('Error: '+e.message,'err');}
}

// ── WITHDRAW BID ──
function openWithdraw(appId){
  pendingWithdrawId=appId;
  document.getElementById('withdraw-ovl').classList.remove('off');
}

async function confirmWithdraw(){
  if(!pendingWithdrawId) return;
  try{
    await db.collection('applications').doc(pendingWithdrawId).delete();
    toast('Bid withdrawn','ok');
    document.getElementById('withdraw-ovl').classList.add('off');
    loadApps();
  }catch(e){toast('Error: '+e.message,'err');}
}

// ── HIRE REQUEST DETAIL ──
var pendingHireAccept=null;
function openHireDetail(hireId, fromName, fromUid){
  pendingHireAccept={id:hireId,fromName:fromName,fromUid:fromUid};
  document.getElementById('hire-detail-content').innerHTML=
    '<div style="background:var(--orange5);border:1px solid #FED7AA;border-radius:12px;padding:14px;margin-bottom:14px;">'+
    '<div style="font-size:14px;font-weight:700;margin-bottom:4px;">From: '+esc(fromName)+'</div>'+
    '<div style="font-size:12px;color:var(--s3);">Accepting this request will open a chat with the main contractor to discuss terms.</div>'+
    '</div>';
  document.getElementById('hire-detail-ovl').classList.remove('off');
}

async function acceptHire(){
  if(!pendingHireAccept) return;
  try{
    await db.collection('hire_requests').doc(pendingHireAccept.id).update({status:'accepted',respondedAt:FS.FieldValue.serverTimestamp()});
    // Open/create conversation
    if(pendingHireAccept.fromUid){
      var snap=await db.collection('conversations').where('participants','array-contains',CU.uid).get();
      var existing=snap.docs.find(function(d){return (d.data().participants||[]).includes(pendingHireAccept.fromUid);});
      if(!existing){
        await db.collection('conversations').add({
          participants:[CU.uid,pendingHireAccept.fromUid],
          participantNames:{[CU.uid]:CD.name||'Contractor',[pendingHireAccept.fromUid]:pendingHireAccept.fromName},
          workTitle:'Direct Hire',lastMsg:'',lastMsgTime:FS.FieldValue.serverTimestamp(),
          unread:{[CU.uid]:0,[pendingHireAccept.fromUid]:0},createdAt:FS.FieldValue.serverTimestamp()
        });
      }
      saveLS('chatTarget',{uid:pendingHireAccept.fromUid,name:pendingHireAccept.fromName});
    }
    toast('Hire request accepted! 🎉','ok');
    document.getElementById('hire-detail-ovl').classList.add('off');
    loadHireRequests();
    setTimeout(function(){location.href='chat.html';},1000);
  }catch(e){toast('Error: '+e.message,'err');}
}

async function declineHire(){
  if(!pendingHireAccept) return;
  try{
    await db.collection('hire_requests').doc(pendingHireAccept.id).update({status:'declined'});
    toast('Hire request declined','ok');
    document.getElementById('hire-detail-ovl').classList.add('off');
    loadHireRequests();
  }catch(e){toast('Error: '+e.message,'err');}
}

// ── CHAT WITH HIRER ──
function chatHirer(uid, name){
  if(!uid){toast('Cannot open chat – no UID','err');return;}
  saveLS('chatTarget',{uid:uid,name:name});
  location.href='chat.html';
}

// ── CHAT FOR A BID ──
async function goChatWork(workId, companyName, postedByUid){
  if(!postedByUid){toast('Chat not available for this work','err');return;}
  try{
    var snap=await db.collection('conversations').where('participants','array-contains',CU.uid).get();
    var existing=snap.docs.find(function(d){return (d.data().participants||[]).includes(postedByUid);});
    if(!existing){
      await db.collection('conversations').add({
        participants:[CU.uid,postedByUid],
        participantNames:{[CU.uid]:CD.name||'Contractor',[postedByUid]:companyName},
        workId:workId,workTitle:companyName,lastMsg:'',
        lastMsgTime:FS.FieldValue.serverTimestamp(),
        unread:{[CU.uid]:0,[postedByUid]:0},createdAt:FS.FieldValue.serverTimestamp()
      });
    }
    saveLS('chatTarget',{uid:postedByUid,name:companyName});
    location.href='chat.html';
  }catch(e){toast('Error opening chat: '+e.message,'err');}
}

// Close overlays on backdrop click
document.querySelectorAll('.ovl').forEach(function(o){o.addEventListener('click',function(e){if(e.target===this)this.classList.add('off');});});
</script>
</body>
</html>
