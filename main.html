<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<meta name="theme-color" content="#1D4ED8"/>
<title>Dashboard — Pragati Work Exchange</title>
<link rel="stylesheet" href="style.css"/>
<style>
.bni{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:6px 4px;flex:1;border:none;background:none;position:relative;}
.bni .ico{width:26px;height:26px;display:flex;align-items:center;justify-content:center;transition:transform .18s;}
.bni .ico svg{stroke:var(--s5);transition:stroke .18s,transform .18s;}
.bni .lbl{font-size:10px;font-weight:600;color:var(--s5);transition:color .18s;letter-spacing:.01em;}
.bni.on .ico svg{stroke:var(--blue2);transform:scale(1.15);}
.bni.on .lbl{color:var(--blue2);}
.bni:active .ico{transform:scale(.9);}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--s7);display:flex;z-index:50;padding:8px 0 max(env(safe-area-inset-bottom),12px);box-shadow:0 -2px 16px rgba(0,0,0,.07);}
.notif-dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--red2);border:2px solid #fff;}
/* Quick stats row */
.qstat{background:#fff;border:1px solid var(--s7);border-radius:14px;padding:14px;margin:10px 16px 0;box-shadow:var(--sh);}
.qstat-row{display:flex;gap:12px;}
.qstat-item{flex:1;text-align:center;}
.qstat-n{font-family:var(--h);font-size:22px;font-weight:800;}
.qstat-l{font-size:10px;color:var(--s4);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
</style>
</head>
<body>
<div id="loader">
  <div class="ld-icon"><img src="https://lh3.googleusercontent.com/d/16oZcVd80uLrux2B-jN84sTUlmOqGoPQd" alt="Pragati" onerror="this.style.display='none'"/></div>
  <div class="ld-brand">Pragati<span>.</span></div>
  <div class="ld-sub">Work Exchange · PragatiOne</div>
  <div class="ld-bar"><div class="ld-fill"></div></div>
</div>
<div id="toast"></div>

<div style="display:flex;flex-direction:column;min-height:100vh;">
  <div class="hh" style="background:linear-gradient(135deg,#065F46,#059669);">
    <div class="hh-top">
      <div><div class="hh-gr">Main Contractor 🏗️</div><div class="hh-nm" id="mh-nm">—</div></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="position:relative;cursor:pointer;" onclick="location.href='notifications.html'">
          <div style="width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:18px;">🔔</div>
          <div class="notif-dot" id="notif-dot" style="display:none;"></div>
        </div>
        <div class="hh-av" id="mh-av" onclick="location.href='profile.html'" style="background:rgba(255,255,255,.2);">MC</div>
      </div>
    </div>
  </div>

  <div class="pscr pb90">
    <div class="mets">
      <div class="met"><div class="mn bl" id="mm-post">0</div><div class="ml">Works Posted</div></div>
      <div class="met"><div class="mn or" id="mm-bids">0</div><div class="ml">Bids Received</div></div>
      <div class="met"><div class="mn gr" id="mm-awd">0</div><div class="ml">Awarded</div></div>
      <div class="met"><div class="mn pu" id="mm-act">0</div><div class="ml">Active</div></div>
    </div>

    <!-- Accept/Respond to Hire Requests notification -->
    <div id="hire-resp-banner" style="display:none;margin:8px 16px 0;background:linear-gradient(135deg,#FFF7ED,#FEF3C7);border:1.5px solid #FED7AA;border-radius:14px;padding:14px 16px;cursor:pointer;" onclick="location.href='hire-status.html'">
      <div style="font-family:var(--h);font-size:14px;font-weight:700;color:var(--orange);">🤝 Hire Request Responses!</div>
      <div id="hire-resp-msg" style="font-size:12px;color:var(--s3);margin-top:3px;"></div>
      <div style="font-size:11px;color:var(--orange2);font-weight:700;margin-top:6px;">View Responses →</div>
    </div>

    <div style="padding:0 16px;"><div class="sh" style="margin-top:12px;"><h3>My Recent Works</h3><a onclick="location.href='myworks.html'">View all →</a></div></div>
    <div style="padding:0 16px;" id="mw-list"><div class="empty"><div class="spin" style="margin:0 auto;"></div></div></div>

    <div style="padding:8px 16px 0;"><div class="sh" style="margin-top:4px;"><h3>Find Contractors Directly</h3><a onclick="location.href='contractors.html'">View all →</a></div></div>
    <div style="padding:0 16px 4px;" id="ctr-preview"></div>

    <div style="padding:10px 16px 4px;display:flex;gap:10px;">
      <button class="btn btn-g" onclick="location.href='contractors.html'" style="flex:1;font-size:13px;">👷 Browse Contractors</button>
      <button class="btn btn-o btn-bl btn-lg" onclick="location.href='post.html'" style="flex:2;">+ Post New Work</button>
    </div>
  </div>

  <nav class="bnav">
    <div class="bni on" onclick="location.href='main.html'"><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div><div class="lbl">Home</div></div>
    <div class="bni" onclick="location.href='post.html'"><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/></svg></div><div class="lbl">Post Work</div></div>
    <div class="bni" onclick="location.href='myworks.html'"><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></div><div class="lbl">My Works</div></div>
    <div class="bni" onclick="location.href='chat.html'"><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 10h.01"/><path d="M12 10h.01"/><path d="M16 10h.01"/></svg></div><div class="lbl">Messages</div></div>
  </nav>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
<script>
var firebase_cfg={apiKey:"AIzaSyBT465A_V0oe-8wkeWk8hee7NXUBSLZcyA",authDomain:"pragati-work-exchange.firebaseapp.com",projectId:"pragati-work-exchange",storageBucket:"pragati-work-exchange.firebasestorage.app",messagingSenderId:"422215240765",appId:"1:422215240765:web:eefb239420262c9d822e54"};
if(!firebase.apps.length) firebase.initializeApp(firebase_cfg);
var auth=firebase.auth(), db=firebase.firestore(), FS=firebase.firestore;
var CU=null,CD=null;
var COLORS=['#1D4ED8','#059669','#7C3AED','#EA580C','#DC2626'];

auth.onAuthStateChanged(async function(user){
  if(!user){location.href='index.html';return;}
  CU=user;
  try{var s=await db.collection('users').doc(user.uid).get();CD=s.exists?s.data():null;}catch(e){}
  if(!CD){location.href='index.html';return;}
  if(!CD||CD.role!=='main'){location.href='home.html';return;}
  document.getElementById('loader').classList.add('out');
  var n=CD.name||'Company';
  document.getElementById('mh-nm').textContent=n;
  document.getElementById('mh-av').textContent=initials(n);
  loadMainDash();
  checkNotifications();
  checkHireResponses();
});

async function loadMainDash(){
  var works=[];
  try{
    var ws=await db.collection('works').where('postedBy','==',CU.uid).get();
    works=ws.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    works.sort(function(a,b){return (b.createdAt&&b.createdAt.toMillis?b.createdAt.toMillis():0)-(a.createdAt&&a.createdAt.toMillis?a.createdAt.toMillis():0);});
  }catch(e){works=DEMO_WORKS.slice(0,3);}
  document.getElementById('mm-post').textContent=works.length;
  document.getElementById('mm-bids').textContent=works.reduce(function(s,w){return s+(w.bids||0);},0);
  document.getElementById('mm-awd').textContent=works.filter(function(w){return w.status==='awarded';}).length;
  document.getElementById('mm-act').textContent=works.filter(function(w){return !w.status||w.status==='open';}).length;

  var list=document.getElementById('mw-list');
  if(!works.length){list.innerHTML=emptyHTML('🏗️','No works posted yet','Post your first work requirement');return;}
  list.innerHTML=works.slice(0,3).map(function(w){
    return '<div class="arow" onclick="location.href=\'bids.html?id='+w.id+'\'">'+
      '<div class="tags" style="margin-bottom:7px;"><span class="tag t-bl">'+esc(w.trade||'—')+'</span>'+
      '<span class="tag '+tagClr(w.urgency)+'">'+esc(w.urgency||'Normal')+'</span></div>'+
      '<div class="art">'+esc(w.title)+'</div>'+
      '<div class="ars">📍 '+esc(w.location||'—')+' · '+(w.bids||0)+' bids</div>'+
      '<div class="arf">'+
        '<span class="sts '+(w.status==='awarded'?'awd':'open')+'">'+(w.status==='awarded'?'Awarded ✓':'Accepting Bids')+'</span>'+
        '<span style="font-size:13px;font-weight:700;color:var(--green2);">'+fmtBud(w)+'</span>'+
      '</div></div>';
  }).join('');

  // Contractor preview from real DB
  loadContractorPreview();
}

async function loadContractorPreview(){
  var ctrs=[];
  try{
    var snap=await db.collection('users').where('role','==','contractor').where('profileComplete','==',true).limit(3).get();
    ctrs=snap.docs.map(function(d){return Object.assign({uid:d.id},d.data());});
  }catch(e){}
  if(!ctrs.length) ctrs=DEMO_CONTRACTORS.filter(function(c){return c.available!==false;}).slice(0,3);

  var el=document.getElementById('ctr-preview');
  if(!el||!ctrs.length){if(el)el.innerHTML='';return;}
  el.innerHTML=ctrs.map(function(c,i){
    var col=COLORS[i%5];
    var av=c.photo?
      '<img style="width:40px;height:40px;border-radius:12px;object-fit:cover;" src="'+esc(c.photo)+'"/>':
      '<div style="width:40px;height:40px;border-radius:12px;background:'+col+';display:flex;align-items:center;justify-content:center;font-family:var(--h);font-size:13px;font-weight:700;color:#fff;">'+initials(c.name||'C')+'</div>';
    return '<div style="background:#fff;border:1px solid var(--s7);border-radius:12px;padding:11px 13px;margin-bottom:8px;display:flex;align-items:center;gap:11px;cursor:pointer;box-shadow:var(--sh);" onclick="location.href=\'contractor-profile.html?uid='+esc(c.uid)+'\'">'+
      av+'<div style="flex:1;"><div style="font-family:var(--h);font-size:13px;font-weight:700;">'+esc(c.name||'Contractor')+'</div>'+
      '<div style="font-size:11px;color:var(--s4);">'+esc(c.trade||'General')+' · '+(c.expYears||0)+' yrs</div>'+
      (c.rating?'<div style="font-size:11px;color:#F59E0B;">⭐ '+c.rating+'</div>':'')+
      '</div>'+
      '<div style="display:flex;gap:6px;" onclick="event.stopPropagation()">'+
        '<button class="btn btn-g btn-sm" onclick="chatContractor(\''+esc(c.uid)+'\',\''+esc(c.name||'Contractor')+'\')">💬</button>'+
        '<button class="btn btn-o btn-sm" onclick="location.href=\'contractor-profile.html?uid='+esc(c.uid)+'\'">Hire →</button>'+
      '</div></div>';
  }).join('');
}

async function checkNotifications(){
  try{
    var snap=await db.collection('notifications').where('toUid','==',CU.uid).where('read','==',false).get();
    if(snap.size>0) document.getElementById('notif-dot').style.display='block';
  }catch(e){}
}

async function checkHireResponses(){
  try{
    var snap=await db.collection('hire_requests').where('fromUid','==',CU.uid).where('status','==','accepted').get();
    if(!snap.empty){
      var h=snap.docs[0].data();
      document.getElementById('hire-resp-banner').style.display='block';
      document.getElementById('hire-resp-msg').textContent=(h.toName||'A contractor')+' accepted your hire request! Open chat to discuss next steps.';
    }
  }catch(e){}
}

async function chatContractor(uid, name){
  if(!uid||uid.startsWith('demo')){toast('Chat not available for demo contractors','err');return;}
  try{
    var snap=await db.collection('conversations').where('participants','array-contains',CU.uid).get();
    var existing=snap.docs.find(function(d){return (d.data().participants||[]).includes(uid);});
    if(!existing){
      await db.collection('conversations').add({
        participants:[CU.uid,uid],
        participantNames:{[CU.uid]:CD.name||'Main Contractor',[uid]:name},
        workId:'',workTitle:'Direct Hire Inquiry',
        lastMsg:'',lastMsgTime:FS.FieldValue.serverTimestamp(),
        unread:{[CU.uid]:0,[uid]:0},createdAt:FS.FieldValue.serverTimestamp()
      });
    }
    saveLS('chatTarget',{uid:uid,name:name});
    location.href='chat.html';
  }catch(e){toast('Error: '+e.message,'err');}
}

function goDetail(id){location.href='detail.html?id='+id;}
function goBids(id){location.href='bids.html?id='+id;}
</script>
</body>
</html>
