<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<meta name="theme-color" content="#1D4ED8"/>
<title>Dashboard — Pragati Work Exchange</title>
<link rel="stylesheet" href="style.css"/>
<style>
.bni{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:6px 4px;flex:1;border:none;background:none;position:relative;}
.bni .ico{width:26px;height:26px;display:flex;align-items:center;justify-content:center;transition:transform .18s;}
.bni .ico svg{stroke:var(--s5);transition:stroke .18s,transform .18s;}
.bni .lbl{font-size:10px;font-weight:600;color:var(--s5);transition:color .18s;letter-spacing:.01em;}
.bni.on .ico svg{stroke:var(--blue2);transform:scale(1.15);}
.bni.on .lbl{color:var(--blue2);}
.bni:active .ico{transform:scale(.9);}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--s7);display:flex;z-index:50;padding:8px 0 max(env(safe-area-inset-bottom),12px);box-shadow:0 -2px 16px rgba(0,0,0,.07);}
</style>
</head>
<body>
<div id="loader">
  <div class="ld-icon"><img src="https://lh3.googleusercontent.com/d/16oZcVd80uLrux2B-jN84sTUlmOqGoPQd" alt="Pragati" onerror="this.style.display='none'"/></div>
  <div class="ld-brand">Pragati<span>.</span></div>
  <div class="ld-sub">Work Exchange · PragatiOne</div>
  <div class="ld-bar"><div class="ld-fill"></div></div>
</div>
<div id="toast"></div>

<div style="display:flex;flex-direction:column;min-height:100vh;">
  <div class="hh" style="background:linear-gradient(135deg,#065F46,#059669);">
    <div class="hh-top">
      <div><div class="hh-gr">Main Contractor 🏗️</div><div class="hh-nm" id="mh-nm">—</div></div>
      <div class="hh-av" id="mh-av" onclick="location.href='profile.html'" style="background:rgba(255,255,255,.2);">MC</div>
    </div>
  </div>
  <div class="pscr pb90">
    <div class="mets">
      <div class="met"><div class="mn bl" id="mm-post">0</div><div class="ml">Works Posted</div></div>
      <div class="met"><div class="mn or" id="mm-bids">0</div><div class="ml">Bids Received</div></div>
      <div class="met"><div class="mn gr" id="mm-awd">0</div><div class="ml">Awarded</div></div>
      <div class="met"><div class="mn pu" id="mm-act">0</div><div class="ml">Active Works</div></div>
    </div>
    <div style="padding:0 16px;"><div class="sh" style="margin-top:4px;"><h3>My Recent Works</h3><a onclick="location.href='myworks.html'">View all →</a></div></div>
    <div style="padding:0 16px;" id="mw-list"><div class="empty"><div class="spin" style="margin:0 auto;"></div></div></div>
    <div style="padding:8px 16px 0;"><div class="sh" style="margin-top:4px;"><h3>Find Contractors Directly</h3><a onclick="location.href='contractors.html'">View all →</a></div></div>
    <div style="padding:0 16px 4px;" id="ctr-preview"></div>
    <div style="padding:10px 16px 4px;display:flex;gap:10px;">
      <button class="btn btn-g" onclick="location.href='contractors.html'" style="flex:1;font-size:13px;">👷 Browse<br/>Contractors</button>
      <button class="btn btn-o btn-bl btn-lg" onclick="location.href='post.html'" style="flex:2;">+ Post New Work</button>
    </div>
  </div>
  <nav class="bnav"><div class="bni on" onclick="location.href='main.html'"><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div><div class="lbl">Home</div></div><div class="bni" onclick="location.href='post.html'"><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/></svg></div><div class="lbl">Post Work</div></div><div class="bni" onclick="location.href='myworks.html'"><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></div><div class="lbl">My Works</div></div><div class="bni" onclick="location.href='chat.html'"><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 10h.01"/><path d="M12 10h.01"/><path d="M16 10h.01"/></svg></div><div class="lbl">Messages</div></div></nav>
</div>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
<script>

const firebase_cfg = {
  apiKey:"AIzaSyBT465A_V0oe-8wkeWk8hee7NXUBSLZcyA",
  authDomain:"pragati-work-exchange.firebaseapp.com",
  projectId:"pragati-work-exchange",
  storageBucket:"pragati-work-exchange.firebasestorage.app",
  messagingSenderId:"422215240765",
  appId:"1:422215240765:web:eefb239420262c9d822e54"
};
if(!firebase.apps.length) firebase.initializeApp(firebase_cfg);
const auth = firebase.auth();
const db   = firebase.firestore();
const FS   = firebase.firestore;
var CU=null, CD=null;
auth.onAuthStateChanged(async function(user){
  if(!user){location.href='index.html';return;}
  CU=user;
  try{var s=await db.collection('users').doc(user.uid).get(); CD=s.exists?s.data():null;}catch(e){}
  if(!CD){location.href='index.html';return;}
  if(!CD || CD.role!=='main'){location.href='home.html';return;}
  document.getElementById('loader').classList.add('out');
  
  var n=CD.name||'Company';
  document.getElementById('mh-nm').textContent=n;
  document.getElementById('mh-av').textContent=initials(n);
  loadMainDash();

});

function toast(msg,type){
  var el=document.getElementById('toast'); el.textContent=msg;
  el.className=type?'on '+type:'on'; setTimeout(function(){el.className='';},3000);
}
function getP(k){return new URLSearchParams(window.location.search).get(k);}
function saveLS(k,v){try{localStorage.setItem('pg_'+k,JSON.stringify(v));}catch(e){}}
function getLS(k){try{return JSON.parse(localStorage.getItem('pg_'+k));}catch(e){return null;}}
function clearLS(k){localStorage.removeItem('pg_'+k);}
function fmtBud(w){
  var f=function(n){return n>=100000?'₹'+(n/100000).toFixed(1).replace('.0','')+'L':'₹'+n.toLocaleString('en-IN');};
  return(w.minBudget&&w.maxBudget)?f(w.minBudget)+'–'+f(w.maxBudget):w.minBudget?f(w.minBudget):'TBD';
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function initials(n){return(n||'U').split(' ').map(function(x){return x[0];}).join('').toUpperCase().slice(0,2);}
function tagClr(u){return u==='Urgent'?'t-or':u==='Critical'?'t-re':'t-gr';}
function emptyHTML(ico,t,s){return '<div class="empty"><div class="ei">'+ico+'</div><h3>'+t+'</h3><p>'+s+'</p></div>';}
function mkCard(w){
  return '<div class="wcard" onclick="goDetail('+JSON.stringify(w.id)+')">'+
    '<div class="wh"><div class="tags"><span class="tag t-bl">'+esc(w.trade||'General')+'</span>'+
    '<span class="tag '+tagClr(w.urgency)+'">'+esc(w.urgency||'Normal')+'</span></div>'+
    '<div class="wt">'+esc(w.title)+'</div>'+
    '<div class="wco">🏢 '+esc(w.company||w.postedByName||'Main Contractor')+'</div></div>'+
    '<div class="wb"><div class="wmeta"><span>📍 '+esc(w.location||'—')+'</span>'+
    '<span>⏱ '+esc(w.startDate||'TBD')+'</span>'+
    '<span>👷 '+esc(w.experience||'—')+'</span></div></div>'+
    '<div class="wf"><span class="wbud">'+fmtBud(w)+'</span>'+
    '<span class="wbids">'+(w.bids||0)+' bids</span></div></div>';
}
</script>
<script>
async function loadMainDash(){
  var works=[];
  try{
    var ws=await db.collection('works').where('postedBy','==',CU.uid).get();
    works=ws.docs.map(function(d){return Object.assign({id:d.id},d.data());});
  }catch(e){works=DEMO_WORKS.slice(0,3);}
  document.getElementById('mm-post').textContent=works.length;
  document.getElementById('mm-bids').textContent=works.reduce(function(s,w){return s+(w.bids||0);},0);
  document.getElementById('mm-awd').textContent=works.filter(function(w){return w.status==='awarded';}).length;
  document.getElementById('mm-act').textContent=works.filter(function(w){return !w.status||w.status==='open';}).length;
  var list=document.getElementById('mw-list');
  if(!works.length){list.innerHTML=emptyHTML('🏗️','No works posted yet','Post your first work requirement');return;}
  list.innerHTML=works.slice(0,3).map(function(w){
    return '<div class="arow" onclick="goBids('+JSON.stringify(w.id)+')">'+
      '<div class="tags" style="margin-bottom:7px;"><span class="tag t-bl">'+esc(w.trade||'—')+'</span>'+
      '<span class="tag '+tagClr(w.urgency)+'">'+esc(w.urgency||'Normal')+'</span></div>'+
      '<div class="art">'+esc(w.title)+'</div>'+
      '<div class="ars">📍 '+esc(w.location||'—')+' · '+(w.bids||0)+' bids</div>'+
      '<div class="arf"><span class="sts '+(w.status==='awarded'?'awd':'open')+'">'+(w.status==='awarded'?'Awarded ✓':'Accepting Bids')+'</span>'+
      '<span style="font-size:13px;font-weight:700;color:var(--green2);">'+fmtBud(w)+'</span></div></div>';
  }).join('');
}
function goDetail(id){location.href='detail.html?id='+id;}
function goBids(id){location.href='bids.html?id='+id;}

// Quick contractor preview on dashboard
(function loadCtrPreview(){
  var COLORS=['#1D4ED8','#059669','#7C3AED','#EA580C','#DC2626'];
  var ctrs=DEMO_CONTRACTORS.filter(function(c){return c.available!==false;}).slice(0,3);
  var el=document.getElementById('ctr-preview');
  if(!el) return;
  el.innerHTML=ctrs.map(function(c,i){
    var col=COLORS[i%5];
    var av=c.photo?'<img style="width:38px;height:38px;border-radius:11px;object-fit:cover;" src="'+c.photo+'"/>':
      '<div style="width:38px;height:38px;border-radius:11px;background:'+col+';display:flex;align-items:center;justify-content:center;font-family:var(--h);font-size:13px;font-weight:700;color:#fff;">'+(c.name||'C').split(' ').map(function(x){return x[0];}).join('').toUpperCase().slice(0,2)+'</div>';
    return '<div style="background:#fff;border:1px solid var(--s7);border-radius:12px;padding:11px 13px;margin-bottom:8px;display:flex;align-items:center;gap:11px;cursor:pointer;box-shadow:var(--sh);" onclick="location.href=\'contractor-profile.html?uid='+c.uid+'\'">'+
      av+'<div style="flex:1;"><div style="font-family:var(--h);font-size:13px;font-weight:700;">'+c.name+'</div>'+
      '<div style="font-size:11px;color:var(--s4);">'+c.trade+' · '+(c.expYears||0)+' yrs · ⭐'+(c.rating||'—')+'</div></div>'+
      '<button class="btn btn-o btn-sm" onclick="event.stopPropagation();location.href=\'contractors.html\'">Hire</button></div>';
  }).join('');
})();
</script>
</body></html>
