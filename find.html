<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<meta name="theme-color" content="#1D4ED8"/>
<title>Find Work — Pragati Work Exchange</title>
<link rel="stylesheet" href="style.css"/>
<style>
.bni{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:6px 4px;flex:1;border:none;background:none;position:relative;}
.bni .ico{width:26px;height:26px;display:flex;align-items:center;justify-content:center;transition:transform .18s;}
.bni .ico svg{stroke:var(--s5);transition:stroke .18s,transform .18s;}
.bni .lbl{font-size:10px;font-weight:600;color:var(--s5);transition:color .18s;letter-spacing:.01em;}
.bni.on .ico svg{stroke:var(--blue2);transform:scale(1.15);}
.bni.on .lbl{color:var(--blue2);}
.bni:active .ico{transform:scale(.9);}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--s7);display:flex;z-index:50;padding:8px 0 max(env(safe-area-inset-bottom),12px);box-shadow:0 -2px 16px rgba(0,0,0,.07);}
</style>
</head>
<body>
<div id="loader">
  <div class="ld-icon"><img src="https://lh3.googleusercontent.com/d/16oZcVd80uLrux2B-jN84sTUlmOqGoPQd" alt="Pragati" onerror="this.style.display='none'"/></div>
  <div class="ld-brand">Pragati<span>.</span></div>
  <div class="ld-sub">Work Exchange · PragatiOne</div>
  <div class="ld-bar"><div class="ld-fill"></div></div>
</div>
<div id="toast"></div>

<div style="display:flex;flex-direction:column;min-height:100vh;">
  <div class="tbar"><h2>Find Work</h2><span id="find-cnt" class="tag t-bl" style="flex-shrink:0;">0 Open</span></div>
  <div style="padding:12px 16px 0;flex-shrink:0;"><div class="sbar-wrap"><input class="sbar" id="s-inp" placeholder="Trade, company, city…" oninput="renderFind()"/></div></div>
  <div class="chips" style="padding:10px 16px 0;flex-shrink:0;" id="trade-chips">
    <div class="chip on" onclick="setChip(this,'')">All</div>
    <div class="chip" onclick="setChip(this,'Plastering')">Plastering</div>
    <div class="chip" onclick="setChip(this,'Flooring')">Flooring</div>
    <div class="chip" onclick="setChip(this,'Electrical')">Electrical</div>
    <div class="chip" onclick="setChip(this,'Painting')">Painting</div>
    <div class="chip" onclick="setChip(this,'Plumbing')">Plumbing</div>
    <div class="chip" onclick="setChip(this,'Masonry')">Masonry</div>
    <div class="chip" onclick="setChip(this,'Carpentry')">Carpentry</div>
  </div>
  <div class="pscr pb90" style="padding:10px 16px 0;" id="find-list"><div class="empty"><div class="spin" style="margin:0 auto;"></div></div></div>
  <nav class="bnav"><div class="bni" onclick="location.href='home.html'"><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div><div class="lbl">Home</div></div><div class="bni on" onclick="location.href='find.html'"><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></div><div class="lbl">Find Work</div></div><div class="bni" onclick="location.href='apps.html'"><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg></div><div class="lbl">My Bids</div></div><div class="bni" onclick="location.href='chat.html'"><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 10h.01"/><path d="M12 10h.01"/><path d="M16 10h.01"/></svg></div><div class="lbl">Messages</div></div></nav>
</div>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
<script>

const firebase_cfg = {
  apiKey:"AIzaSyBT465A_V0oe-8wkeWk8hee7NXUBSLZcyA",
  authDomain:"pragati-work-exchange.firebaseapp.com",
  projectId:"pragati-work-exchange",
  storageBucket:"pragati-work-exchange.firebasestorage.app",
  messagingSenderId:"422215240765",
  appId:"1:422215240765:web:eefb239420262c9d822e54"
};
if(!firebase.apps.length) firebase.initializeApp(firebase_cfg);
const auth = firebase.auth();
const db   = firebase.firestore();
const FS   = firebase.firestore;
var CU=null, CD=null;
auth.onAuthStateChanged(async function(user){
  if(!user){location.href='index.html';return;}
  CU=user;
  try{var s=await db.collection('users').doc(user.uid).get(); CD=s.exists?s.data():null;}catch(e){}
  if(!CD){location.href='index.html';return;}
  
  document.getElementById('loader').classList.add('out');
  loadFind();
});

function toast(msg,type){
  var el=document.getElementById('toast'); el.textContent=msg;
  el.className=type?'on '+type:'on'; setTimeout(function(){el.className='';},3000);
}
function getP(k){return new URLSearchParams(window.location.search).get(k);}
function saveLS(k,v){try{localStorage.setItem('pg_'+k,JSON.stringify(v));}catch(e){}}
function getLS(k){try{return JSON.parse(localStorage.getItem('pg_'+k));}catch(e){return null;}}
function clearLS(k){localStorage.removeItem('pg_'+k);}
function fmtBud(w){
  var f=function(n){return n>=100000?'₹'+(n/100000).toFixed(1).replace('.0','')+'L':'₹'+n.toLocaleString('en-IN');};
  return(w.minBudget&&w.maxBudget)?f(w.minBudget)+'–'+f(w.maxBudget):w.minBudget?f(w.minBudget):'TBD';
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function initials(n){return(n||'U').split(' ').map(function(x){return x[0];}).join('').toUpperCase().slice(0,2);}
function tagClr(u){return u==='Urgent'?'t-or':u==='Critical'?'t-re':'t-gr';}
function emptyHTML(ico,t,s){return '<div class="empty"><div class="ei">'+ico+'</div><h3>'+t+'</h3><p>'+s+'</p></div>';}
function mkCard(w){
  return '<div class="wcard" onclick="goDetail('+JSON.stringify(w.id)+')">'+
    '<div class="wh"><div class="tags"><span class="tag t-bl">'+esc(w.trade||'General')+'</span>'+
    '<span class="tag '+tagClr(w.urgency)+'">'+esc(w.urgency||'Normal')+'</span></div>'+
    '<div class="wt">'+esc(w.title)+'</div>'+
    '<div class="wco">🏢 '+esc(w.company||w.postedByName||'Main Contractor')+'</div></div>'+
    '<div class="wb"><div class="wmeta"><span>📍 '+esc(w.location||'—')+'</span>'+
    '<span>⏱ '+esc(w.startDate||'TBD')+'</span>'+
    '<span>👷 '+esc(w.experience||'—')+'</span></div></div>'+
    '<div class="wf"><span class="wbud">'+fmtBud(w)+'</span>'+
    '<span class="wbids">'+(w.bids||0)+' bids</span></div></div>';
}
</script>
<script>
var allWorks=[],filterTV='';
async function loadFind(){
  try{
    var ws=await db.collection('works').orderBy('createdAt','desc').get();
    allWorks=ws.docs.map(function(d){return Object.assign({id:d.id},d.data());});
  }catch(e){allWorks=DEMO_WORKS;}
  var t=getP('trade');
  if(t){filterTV=t; document.querySelectorAll('#trade-chips .chip').forEach(function(c){c.classList.toggle('on',c.textContent.trim()===t);});}
  renderFind();
}
function renderFind(){
  var q=document.getElementById('s-inp').value.toLowerCase();
  var arr=allWorks.filter(function(w){return (w.title+' '+w.location+' '+w.trade+' '+(w.company||w.postedByName||'')).toLowerCase().includes(q);});
  if(filterTV) arr=arr.filter(function(w){return w.trade===filterTV;});
  document.getElementById('find-cnt').textContent=arr.length+' Open';
  document.getElementById('find-list').innerHTML=arr.length?arr.map(mkCard).join(''):emptyHTML('🔍','No results','Try different filters');
}
function setChip(el,t){
  document.querySelectorAll('#trade-chips .chip').forEach(function(c){c.classList.remove('on');});
  el.classList.add('on'); filterTV=t; renderFind();
}
function goDetail(id){location.href='detail.html?id='+id;}
</script>
</body></html>
